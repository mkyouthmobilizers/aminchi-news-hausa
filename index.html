<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://kszficrcngxipcllezgl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_hsMkfMvXMbAXXt8Z7LvAvg_52miDaJe";

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   ELEMENTS
========================= */

const postsContainer =
  document.getElementById("posts");

const visitorCount =
  document.getElementById("visitorCount");

const liveStatus =
  document.getElementById("liveStatus");

const liveContainer =
  document.getElementById("liveContainer");

const newsSection =
  document.getElementById("newsSection");

const articleSection =
  document.getElementById("articleSection");

const articleContent =
  document.getElementById("articleContent");


/* =========================
   VISITOR ID
========================= */

function getVisitorId(){

  let id =
    localStorage.getItem("mk_visitor_id");

  if(!id){

    if(
      window.crypto &&
      crypto.randomUUID
    ){

      id = crypto.randomUUID();

    }else{

      id =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2);

    }

    localStorage.setItem(
      "mk_visitor_id",
      id
    );

  }

  return id;

}


/* =========================
   VISITOR COUNTER
========================= */

async function updateVisitorCounter(){

  const STARTING_VISITORS = 10000;

  visitorCount.textContent =
    STARTING_VISITORS.toLocaleString();


  try{

    const alreadyCounted =
      localStorage.getItem(
        "mk_visitor_counted"
      );


    if(!alreadyCounted){

      const insertResult =
        await client
          .from("visitors")
          .insert({});

      if(insertResult.error){

        console.error(
          "Visitor insert error:",
          insertResult.error
        );

      }else{

        localStorage.setItem(
          "mk_visitor_counted",
          "true"
        );

      }

    }


    const countResult =
      await client
        .from("visitors")
        .select("*",{
          count:"exact",
          head:true
        });


    if(countResult.error){

      console.error(
        "Visitor count error:",
        countResult.error
      );

      visitorCount.textContent =
        STARTING_VISITORS.toLocaleString();

      return;

    }


    const realVisitors =
      Number(countResult.count || 0);


    const totalVisitors =
      STARTING_VISITORS +
      realVisitors;


    visitorCount.textContent =
      totalVisitors.toLocaleString();


  }catch(error){

    console.error(
      "Visitor error:",
      error
    );

    visitorCount.textContent =
      STARTING_VISITORS.toLocaleString();

  }

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(date){

  if(!date){

    return "";

  }

  const d =
    new Date(date);

  return d.toLocaleString(
    "en-GB",
    {
      day:"numeric",
      month:"long",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================
   VIDEO CHECK
========================= */

function isVideo(url){

  if(!url){

    return false;

  }

  const clean =
    url.split("?")[0]
      .toLowerCase();

  return (
    clean.endsWith(".mp4") ||
    clean.endsWith(".webm") ||
    clean.endsWith(".mov") ||
    clean.endsWith(".m4v")
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}


/* =========================
   LOAD POSTS
========================= */

let allPosts = [];


async function loadPosts(){

  postsContainer.innerHTML =
    "Loading posts...";


  const result =
    await client
      .from("posts")
      .select(
        "id,Title,Content,Image_url,created_at"
      )
      .order(
        "created_at",
        {ascending:false}
      )
      .order(
        "id",
        {ascending:false}
      );


  if(result.error){

    console.error(
      result.error
    );

    postsContainer.innerHTML =
      "<p>Unable to load posts.</p>";

    return;

  }


  allPosts =
    result.data || [];


  if(!allPosts.length){

    postsContainer.innerHTML =
      "<p>No posts yet.</p>";

    return;

  }


  postsContainer.innerHTML = "";


  for(const post of allPosts){

    const card =
      createPostCard(post);

    postsContainer.appendChild(card);

    loadEngagement(post,card);

  }


  /* OPEN POST FROM URL HASH */

  const hash =
    window.location.hash;

  if(hash.startsWith("#post-")){

    const id =
      Number(
        hash.replace("#post-","")
      );

    const post =
      allPosts.find(
        p => Number(p.id) === id
      );

    if(post){

      openArticle(post);

    }

  }

}


/* =========================
   CREATE POST CARD
========================= */

function createPostCard(post){

  const card =
    document.createElement("article");

  card.className =
    "post";


  card.addEventListener(
    "click",
    function(){

      openArticle(post);

    }
  );


  const header =
    document.createElement("div");

  header.className =
    "post-header";


  header.innerHTML = `

    <img
      src="IMG_3240.jpeg"
      class="author-img"
      alt="MK Youth Mobilizers">

    <div>

      <div class="author-name">
        MK Youth Mobilizers
      </div>

      <div class="post-date">
        ${escapeHtml(
          formatDate(post.created_at)
        )}
      </div>

    </div>

  `;


  card.appendChild(header);


  /* MEDIA */

  if(post.Image_url){

    if(isVideo(post.Image_url)){

      const video =
        document.createElement("video");

      video.className =
        "post-media";

      video.src =
        post.Image_url;

      video.controls =
        true;

      video.playsInline =
        true;

      video.addEventListener(
        "click",
        e => e.stopPropagation()
      );

      card.appendChild(video);

    }else{

      const img =
        document.createElement("img");

      img.className =
        "post-media";

      img.src =
        post.Image_url;

      img.alt =
        post.Title || "Post";

      img.loading =
        "lazy";

      img.addEventListener(
        "click",
        e => {

          e.stopPropagation();

          openArticle(post);

        }
      );

      card.appendChild(img);

    }

  }


  /* BODY */

  const body =
    document.createElement("div");

  body.className =
    "post-body";


  const title =
    document.createElement("div");

  title.className =
    "post-title";

  title.textContent =
    post.Title || "";


  const content =
    document.createElement("div");

  content.className =
    "post-content";

  content.textContent =
    post.Content || "";


  body.appendChild(title);

  body.appendChild(content);


  /* ACTIONS */

  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  const likeBtn =
    document.createElement("button");

  likeBtn.className =
    "action-btn like-btn";

  likeBtn.innerHTML =
    "❤️ Like <span>0</span>";


  likeBtn.addEventListener(
    "click",
    async function(e){

      e.stopPropagation();

      await toggleLike(
        post,
        likeBtn
      );

    }
  );


  const commentBtn =
    document.createElement("button");

  commentBtn.className =
    "action-btn";

  commentBtn.innerHTML =
    "💬 Comment <span>0</span>";


  commentBtn.addEventListener(
    "click",
    function(e){

      e.stopPropagation();

      const comments =
        card.querySelector(
          ".comments"
        );

      comments.classList.toggle(
        "show"
      );

    }
  );


  const shareBtn =
    document.createElement("button");

  shareBtn.className =
    "action-btn";

  shareBtn.innerHTML =
    "🔄 Share";


  shareBtn.addEventListener(
    "click",
    function(e){

      e.stopPropagation();

      sharePost(post);

    }
  );


  actions.appendChild(likeBtn);

  actions.appendChild(commentBtn);

  actions.appendChild(shareBtn);


  body.appendChild(actions);


  /* COMMENTS */

  const comments =
    createCommentsSection(
      post,
      commentBtn
    );


  body.appendChild(comments);


  card.appendChild(body);


  return card;

}


/* =========================
   LOAD ENGAGEMENT
========================= */

async function loadEngagement(
  post,
  card
){

  const likeBtn =
    card.querySelector(
      ".like-btn"
    );

  const commentBtn =
    card.querySelector(
      ".action-btn:nth-child(2)"
    );


  /* LIKES */

  const likesResult =
    await client
      .from("post_likes")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "post_id",
        post.id
      );


  if(!likesResult.error){

    const count =
      likesResult.count || 0;

    const span =
      likeBtn.querySelector("span");

    span.textContent =
      count;

  }


  /* CHECK USER LIKE */

  const visitorId =
    getVisitorId();


  const likedResult =
    await client
      .from("post_likes")
      .select("id")
      .eq(
        "post_id",
        post.id
      )
      .eq(
        "visitor_id",
        visitorId
      )
      .maybeSingle();


  if(
    !likedResult.error &&
    likedResult.data
  ){

    likeBtn.classList.add(
      "liked"
    );

  }


  /* COMMENTS */

  const commentsResult =
    await client
      .from("post_comments")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "post_id",
        post.id
      );


  if(!commentsResult.error){

    const count =
      commentsResult.count || 0;

    const span =
      commentBtn.querySelector(
        "span"
      );

    span.textContent =
      count;

  }


  loadComments(post,card);

}


/* =========================
   TOGGLE LIKE
========================= */

async function toggleLike(
  post,
  button
){

  const visitorId =
    getVisitorId();


  const existing =
    await client
      .from("post_likes")
      .select("id")
      .eq(
        "post_id",
        post.id
      )
      .eq(
        "visitor_id",
        visitorId
      )
      .maybeSingle();


  if(existing.error){

    alert(
      "Unable to check Like."
    );

    console.error(
      existing.error
    );

    return;

  }


  if(existing.data){

    /* REMOVE LIKE */

    const result =
      await client
        .from("post_likes")
        .delete()
        .eq(
          "id",
          existing.data.id
        );


    if(result.error){

      console.error(
        result.error
      );

      alert(
        "Unable to remove Like."
      );

      return;

    }


    button.classList.remove(
      "liked"
    );


  }else{

    /* ADD LIKE */

    const result =
      await client
        .from("post_likes")
        .insert({
          post_id:post.id,
          visitor_id:visitorId
        });


    if(result.error){

      console.error(
        result.error
      );

      alert(
        "Unable to Like this post."
      );

      return;

    }


    button.classList.add(
      "liked"
    );

  }


  /* UPDATE COUNT */

  const countResult =
    await client
      .from("post_likes")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "post_id",
        post.id
      );


  if(!countResult.error){

    button.querySelector(
      "span"
    ).textContent =
      countResult.count || 0;

  }

}


/* =========================
   COMMENTS SECTION
========================= */

function createCommentsSection(
  post,
  commentBtn
){

  const section =
    document.createElement("div");

  section.className =
    "comments";


  const form =
    document.createElement("div");

  form.className =
    "comment-form";


  const name =
    document.createElement("input");

  name.placeholder =
    "Your name";


  const textarea =
    document.createElement("textarea");

  textarea.placeholder =
    "Write a comment...";


  const submit =
    document.createElement("button");

  submit.className =
    "comment-submit";

  submit.textContent =
    "Post Comment";


  submit.addEventListener(
    "click",
    async function(e){

      e.stopPropagation();


      const userName =
        name.value.trim();

      const comment =
        textarea.value.trim();


      if(!userName){

        alert(
          "Please enter your name."
        );

        return;

      }


      if(!comment){

        alert(
          "Please write a comment."
        );

        return;

      }


      submit.disabled =
        true;

      submit.textContent =
        "Posting...";


      const result =
        await client
          .from("post_comments")
          .insert({

            post_id:post.id,

            visitor_id:
              getVisitorId(),

            name:userName,

            comment:comment

          });


      submit.disabled =
        false;

      submit.textContent =
        "Post Comment";


      if(result.error){

        console.error(
          result.error
        );

        alert(
          "Comment could not be posted."
        );

        return;

      }


      name.value =
        "";

      textarea.value =
        "";


      await loadComments(
        post,
        section.closest(".post")
      );


      const countResult =
        await client
          .from("post_comments")
          .select(
            "id",
            {
              count:"exact",
              head:true
            }
          )
          .eq(
            "post_id",
            post.id
          );


      if(!countResult.error){

        commentBtn.querySelector(
          "span"
        ).textContent =
          countResult.count || 0;

      }

    }
  );


  form.appendChild(name);

  form.appendChild(textarea);

  form.appendChild(submit);


  section.appendChild(form);


  const list =
    document.createElement("div");

  list.className =
    "comment-list";


  section.appendChild(list);


  return section;

}


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(
  post,
  card
){

  if(!card){

    return;

  }


  const list =
    card.querySelector(
      ".comment-list"
    );


  if(!list){

    return;

  }


  const result =
    await client
      .from("post_comments")
      .select(
        "id,name,comment,created_at"
      )
      .eq(
        "post_id",
        post.id
      )
      .order(
        "created_at",
        {ascending:false}
      );


  if(result.error){

    console.error(
      result.error
    );

    return;

  }


  list.innerHTML =
    "";


  if(!result.data ||
     !result.data.length){

    list.innerHTML =
      '<div class="empty-comments">No comments yet.</div>';

    return;

  }


  result.data.forEach(
    comment => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "comment";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "comment-name";

      name.textContent =
        comment.name;


      const text =
        document.createElement(
          "div"
        );

      text.className =
        "comment-text";

      text.textContent =
        comment.comment;


      const date =
        document.createElement(
          "div"
        );

      date.className =
        "comment-date";

      date.textContent =
        formatDate(
          comment.created_at
        );


      item.appendChild(name);

      item.appendChild(text);

      item.appendChild(date);


      list.appendChild(item);

    }
  );

}


/* =========================
   SHARE POST
========================= */

async function sharePost(post){

  const shareUrl =
    window.location.origin +
    window.location.pathname +
    "#post-" +
    post.id;


  const shareData = {

    title:
      post.Title ||
      "MK Youth Mobilizers",

    text:
      post.Content
        ? post.Content.substring(0,180)
        : "MK Youth Mobilizers",

    url:shareUrl

  };


  /* iPhone / Android Native Share */

  if(
    navigator.share
  ){

    try{

      await navigator.share(
        shareData
      );

      return;

    }catch(error){

      if(
        error.name ===
        "AbortError"
      ){

        return;

      }

    }

  }


  /* COPY LINK */

  try{

    await navigator.clipboard.writeText(
      shareUrl
    );

    alert(
      "Post link copied successfully."
    );

  }catch(error){

    /* WhatsApp fallback */

    const whatsappUrl =
      "https://wa.me/?text=" +
      encodeURIComponent(
        shareData.title +
        "\n\n" +
        shareUrl
      );


    window.open(
      whatsappUrl,
      "_blank"
    );

  }

}


/* =========================
   OPEN ARTICLE
========================= */

function openArticle(post){

  newsSection.style.display =
    "none";

  articleSection.style.display =
    "block";


  const media =
    post.Image_url
      ? (
        isVideo(post.Image_url)

          ? `
            <video
              class="post-media"
              controls
              playsinline
              src="${escapeHtml(
                post.Image_url
              )}">
            </video>
          `

          : `
            <img
              class="post-media"
              src="${escapeHtml(
                post.Image_url
              )}"
              alt="${escapeHtml(
                post.Title
              )}">
          `
      )

      : "";


  articleContent.innerHTML = `

    ${media}

    <div class="article-body">

      <h1 class="article-title">
        ${escapeHtml(
          post.Title
        )}
      </h1>

      <div class="article-date">
        ${escapeHtml(
          formatDate(
            post.created_at
          )
        )}
      </div>

      <div class="article-content">
        ${escapeHtml(
          post.Content
        )}
      </div>

    </div>

  `;


  history.pushState(
    null,
    "",
    "#post-" + post.id
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   CLOSE ARTICLE
========================= */

function closeArticle(){

  articleSection.style.display =
    "none";

  newsSection.style.display =
    "block";


  history.pushState(
    null,
    "",
    window.location.pathname
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   YOUTUBE LIVE
========================= */

async function loadLive(){

  liveStatus.innerHTML =
    "Checking live status...";

  liveContainer.innerHTML =
    "";


  const result =
    await client
      .from("live_stream")
      .select(
        "id,youtube_id,active"
      )
      .eq(
        "id",
        1
      )
      .maybeSingle();


  if(result.error){

    console.error(
      "Live error:",
      result.error
    );

    liveStatus.innerHTML =
      "Unable to load Live status.";

    return;

  }


  const data =
    result.data;


  if(
    data &&
    data.active &&
    data.youtube_id
  ){

    liveStatus.innerHTML =
      '<span style="color:red;font-weight:bold;">🔴 LIVE NOW</span>';


    const iframe =
      document.createElement(
        "iframe"
      );

    iframe.className =
      "live-video";

    iframe.src =
      "https://www.youtube.com/embed/" +
      encodeURIComponent(
        data.youtube_id
      ) +
      "?autoplay=1";

    iframe.allow =
      "autoplay; encrypted-media; picture-in-picture";

    iframe.allowFullscreen =
      true;


    liveContainer.appendChild(
      iframe
    );

  }else{

    liveStatus.innerHTML =
      '<span class="live-off">🔴 Live is currently OFF</span>';

  }

}


/* =========================
   START
========================= */

updateVisitorCounter();

loadPosts();

loadLive();

</script>
