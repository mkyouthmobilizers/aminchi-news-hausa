<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MK Youth Mobilizers Media Team Tarauni</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f4f4;
  color:#111;
}

header{
  background:#111;
  color:white;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:white;
}

.brand h1{
  font-size:18px;
  line-height:1.2;
}

.brand small{
  color:#bbb;
}

.visitor{
  font-size:13px;
  text-align:right;
}

.visitor strong{
  color:#ffcc00;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px 15px;
}

.live-box{
  background:#111;
  color:white;
  border-radius:10px;
  padding:15px;
  margin-bottom:20px;
}

.live-title{
  color:#ff3333;
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.live-video{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  border-radius:8px;
}

.no-live{
  background:#222;
  padding:20px;
  border-radius:8px;
  color:#bbb;
  text-align:center;
}

.search-box{
  margin-bottom:15px;
}

.search-box input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  outline:none;
}

.search-box input:focus{
  border-color:#111;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:20px;
}

.category-btn{
  border:0;
  padding:10px 14px;
  border-radius:20px;
  background:white;
  cursor:pointer;
  white-space:nowrap;
  font-weight:bold;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}

.category-btn.active{
  background:#111;
  color:white;
}

.section-title{
  font-size:25px;
  margin:25px 0 15px;
  border-left:5px solid #111;
  padding-left:10px;
}

.trending{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.trending-card{
  background:white;
  border-radius:9px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.trending-card img,
.trending-card video{
  width:100%;
  height:120px;
  object-fit:cover;
  display:block;
}

.trending-content{
  padding:10px;
}

.trending-rank{
  color:#e00000;
  font-weight:bold;
  font-size:14px;
}

.trending-title{
  font-weight:bold;
  margin-top:5px;
  line-height:1.3;
}

.trending-views{
  color:#666;
  font-size:13px;
  margin-top:7px;
}

.posts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.post-card{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.post-media{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
  background:#ddd;
}

.post-body{
  padding:15px;
}

.category-badge{
  display:inline-block;
  background:#111;
  color:white;
  padding:5px 9px;
  border-radius:5px;
  font-size:12px;
  margin-bottom:8px;
}

.post-title{
  font-size:20px;
  line-height:1.3;
  margin-bottom:8px;
}

.post-date{
  color:#777;
  font-size:13px;
  margin-bottom:10px;
}

.post-preview{
  color:#333;
  line-height:1.5;
}

.post-stats{
  display:flex;
  gap:15px;
  color:#666;
  font-size:13px;
  margin-top:12px;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:14px;
}

.action-btn{
  flex:1;
  border:0;
  background:#eee;
  padding:9px 5px;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
}

.action-btn:hover{
  background:#ddd;
}

.read-more{
  width:100%;
  margin-top:10px;
  border:0;
  background:#111;
  color:white;
  padding:11px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.comment-box{
  display:none;
  margin-top:10px;
}

.comment-box input,
.comment-box textarea{
  width:100%;
  padding:9px;
  border:1px solid #ccc;
  border-radius:6px;
  margin-bottom:7px;
}

.comment-box textarea{
  min-height:70px;
  resize:vertical;
}

.comment-submit{
  width:100%;
  padding:9px;
  border:0;
  background:#111;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

.comments-list{
  margin-top:10px;
}

.comment-item{
  background:#f3f3f3;
  padding:8px;
  border-radius:6px;
  margin-bottom:6px;
  font-size:13px;
}

.comment-name{
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:#777;
  grid-column:1/-1;
}

.loading{
  text-align:center;
  padding:40px;
  color:#666;
  grid-column:1/-1;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:2000;
  overflow-y:auto;
  padding:30px 15px;
}

.modal-content{
  max-width:850px;
  margin:auto;
  background:white;
  border-radius:10px;
  overflow:hidden;
}

.modal-header{
  padding:15px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid #ddd;
}

.close{
  font-size:28px;
  cursor:pointer;
  font-weight:bold;
}

.modal-body{
  padding:20px;
}

.modal-body img,
.modal-body video{
  width:100%;
  max-height:500px;
  object-fit:contain;
  background:#111;
  border-radius:8px;
  margin:15px 0;
}

.article-category{
  display:inline-block;
  background:#111;
  color:white;
  padding:6px 10px;
  border-radius:5px;
  font-size:13px;
}

.article-title{
  font-size:32px;
  line-height:1.2;
  margin:12px 0;
}

.article-date{
  color:#777;
  font-size:14px;
  margin-bottom:15px;
}

.article-content{
  white-space:pre-wrap;
  font-size:17px;
  line-height:1.8;
}

.article-views{
  color:#666;
  font-size:14px;
  margin-bottom:15px;
}

footer{
  margin-top:40px;
  background:#111;
  color:white;
  text-align:center;
  padding:25px 15px;
}

@media(max-width:900px){
  .posts{
    grid-template-columns:repeat(2,1fr);
  }

  .trending{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .header-inner{
    align-items:flex-start;
  }

  .brand h1{
    font-size:15px;
  }

  .visitor{
    font-size:11px;
  }

  .posts{
    grid-template-columns:1fr;
  }

  .trending{
    grid-template-columns:1fr 1fr;
  }

  .post-media{
    height:230px;
  }

  .article-title{
    font-size:25px;
  }
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://kszficrcngxipcllezgl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hsMkfMvXMbAXXt8Z7LvAvg_52miDaJe";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let allPosts = [];

let currentCategory = "Duka";

let currentSearch = "";


/* =========================
   VISITOR COUNTER
========================= */

const STARTING_VISITORS = 10000;

async function countVisitor(){

  const counted =
    localStorage.getItem("mk_visitor_counted");

  if(!counted){

    const visitorId =
      crypto.randomUUID();

    const { error } =
      await supabaseClient
      .from("visitors")
      .insert({
        visitor_id: visitorId
      });

    if(!error){

      localStorage.setItem(
        "mk_visitor_counted",
        "true"
      );

    }

  }

  const { count } =
    await supabaseClient
    .from("visitors")
    .select("*", {
      count:"exact",
      head:true
    });

  document.getElementById(
    "visitorCount"
  ).textContent =
    (STARTING_VISITORS + (count || 0))
    .toLocaleString();

}


/* =========================
   LIVE STREAM
========================= */

async function loadLive(){

  const { data, error } =
    await supabaseClient
    .from("live_stream")
    .select("id,youtube_id,active")
    .eq("id",1)
    .maybeSingle();

  if(error){

    console.log(error);

    return;

  }

  const container =
    document.getElementById(
      "liveContainer"
    );

  if(
    data &&
    data.active &&
    data.youtube_id
  ){

    container.innerHTML = `

      <iframe
        class="live-video"
        src="https://www.youtube.com/embed/${data.youtube_id}?autoplay=1"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>

    `;

  }else{

    container.innerHTML = `

      <div class="no-live">
        YouTube Live ba ya fara ba tukuna.
      </div>

    `;

  }

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  const postsContainer =
    document.getElementById(
      "posts"
    );

  postsContainer.innerHTML =
    `<div class="loading">
      Ana ɗauko labarai...
    </div>`;

  const { data, error } =
    await supabaseClient
    .from("posts")
    .select(
      "id,Title,Content,Image_url,category,views,created_at"
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .order(
      "id",
      {
        ascending:false
      }
    );

  if(error){

    console.error(error);

    postsContainer.innerHTML =
      `<div class="empty">
        An samu matsala wajen ɗauko labarai.
      </div>`;

    return;

  }

  allPosts = data || [];

  renderPosts();

  renderTrending();

}


/* =========================
   FILTER POSTS
========================= */

function getFilteredPosts(){

  return allPosts.filter(post => {

    const categoryMatch =
      currentCategory === "Duka" ||
      post.category === currentCategory;

    const search =
      currentSearch
      .trim()
      .toLowerCase();

    const searchMatch =
      !search ||
      (post.Title || "")
        .toLowerCase()
        .includes(search) ||

      (post.Content || "")
        .toLowerCase()
        .includes(search) ||

      (post.category || "")
        .toLowerCase()
        .includes(search);

    return categoryMatch &&
           searchMatch;

  });

}


/* =========================
   RENDER POSTS
========================= */

function renderPosts(){

  const container =
    document.getElementById(
      "posts"
    );

  const posts =
    getFilteredPosts();

  if(!posts.length){

    container.innerHTML =
      `<div class="empty">
        Babu wani labari da ya dace da bincikenka.
      </div>`;

    return;

  }

  container.innerHTML =
    posts.map(post =>
      createPostCard(post)
    ).join("");

}


/* =========================
   CREATE POST CARD
========================= */

function createPostCard(post){

  const date =
    formatDate(post.created_at);

  const preview =
    makePreview(post.Content,35);

  const views =
    Number(post.views || 0);

  let media = "";

  if(post.Image_url){

    if(isVideo(post.Image_url)){

      media = `
        <video
          class="post-media"
          controls
          preload="metadata">
          <source src="${escapeHtml(post.Image_url)}">
        </video>
      `;

    }else{

      media = `
        <img
          class="post-media"
          src="${escapeHtml(post.Image_url)}"
          alt="${escapeHtml(post.Title)}"
          loading="lazy">
      `;

    }

  }else{

    media = `
      <div
        class="post-media"
        style="
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:50px;
        ">
        📰
      </div>
    `;

  }


  return `

    <article
      class="post-card"
      id="post-${post.id}">

      ${media}

      <div class="post-body">

        <span class="category-badge">
          ${escapeHtml(post.category || "Labarai")}
        </span>

        <h3 class="post-title">
          ${escapeHtml(post.Title)}
        </h3>

        <div class="post-date">
          📅 ${date}
        </div>

        <div class="post-preview">
          ${escapeHtml(preview)}
        </div>

        <div class="post-stats">

          <span>
            👁️ ${views.toLocaleString()}
          </span>

          <span>
            💬 <span id="comment-count-${post.id}">
              0
            </span>
          </span>

        </div>

        <div class="actions">

          <button
            class="action-btn"
            onclick="likePost(${post.id},this)">
            👍 <span>0</span>
          </button>

          <button
            class="action-btn"
            onclick="toggleComments(${post.id})">
            💬 Comment
          </button>

          <button
            class="action-btn"
            onclick="sharePost(${post.id})">
            🔄 Share
          </button>

        </div>

        <button
          class="read-more"
          onclick="openArticleById(${post.id})">

          📖 Read more

        </button>


        <div
          id="comments-${post.id}"
          class="comment-box">

          <input
            id="name-${post.id}"
            placeholder="Sunanka">

          <textarea
            id="comment-${post.id}"
            placeholder="Rubuta comment...">
          </textarea>

          <button
            class="comment-submit"
            onclick="submitComment(${post.id})">

            Tura Comment

          </button>

          <div
            id="comments-list-${post.id}"
            class="comments-list">
          </div>

        </div>

      </div>

    </article>

  `;

}


/* =========================
   TRENDING
========================= */

function renderTrending(){

  const container =
    document.getElementById(
      "trendingPosts"
    );

  let posts =
    [...allPosts]
    .sort(
      (a,b) =>
        Number(b.views || 0) -
        Number(a.views || 0)
    )
    .slice(0,5);

  if(!posts.length){

    container.innerHTML =
      `<div class="empty">
        Babu Trending News tukuna.
      </div>`;

    return;

  }

  container.innerHTML =
    posts.map(
      (post,index) => {

        let media = "";

        if(post.Image_url){

          if(isVideo(post.Image_url)){

            media = `
              <video
                src="${escapeHtml(post.Image_url)}"
                muted
                preload="metadata">
              </video>
            `;

          }else{

            media = `
              <img
                src="${escapeHtml(post.Image_url)}"
                alt=""
                loading="lazy">
            `;

          }

        }else{

          media = `
            <div
              style="
                height:120px;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:40px;
                background:#ddd;
              ">
              📰
            </div>
          `;

        }

        return `

          <div
            class="trending-card"
            onclick="openArticleById(${post.id})">

            ${media}

            <div class="trending-content">

              <div class="trending-rank">
                #${index + 1} 🔥
              </div>

              <div class="trending-title">
                ${escapeHtml(post.Title)}
              </div>

              <div class="trending-views">
                👁️
                ${Number(post.views || 0)
                  .toLocaleString()}
                views
              </div>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =========================
   INCREMENT VIEW
========================= */

async function incrementView(postId){

  const viewKey =
    `mk_viewed_${postId}`;

  /*
    Wannan yana hana browser daya
    ƙara view sau da yawa a session
  */

  if(
    sessionStorage.getItem(viewKey)
  ){

    return false;

  }

  const { error } =
    await supabaseClient
    .rpc(
      "increment_post_view",
      {
        post_id_input: postId
      }
    );

  if(error){

    console.error(
      "View error:",
      error
    );

    return false;

  }

  sessionStorage.setItem(
    viewKey,
    "true"
  );

  return true;

}


/* =========================
   OPEN ARTICLE
========================= */

async function openArticleById(postId){

  const post =
    allPosts.find(
      p => Number(p.id) === Number(postId)
    );

  if(!post){

    return;

  }

  await openArticle(post);

}


/* =========================
   ARTICLE
========================= */

async function openArticle(post){

  const increased =
    await incrementView(post.id);

  if(increased){

    post.views =
      Number(post.views || 0) + 1;

    renderPosts();

    renderTrending();

  }

  const modal =
    document.getElementById(
      "articleModal"
    );

  const body =
    document.getElementById(
      "articleBody"
    );

  let media = "";

  if(post.Image_url){

    if(isVideo(post.Image_url)){

      media = `
        <video
          controls
          autoplay
          src="${escapeHtml(post.Image_url)}">
        </video>
      `;

    }else{

      media = `
        <img
          src="${escapeHtml(post.Image_url)}"
          alt="${escapeHtml(post.Title)}">
      `;

    }

  }


  body.innerHTML = `

    <span class="article-category">
      ${escapeHtml(post.category || "Labarai")}
    </span>

    <h1 class="article-title">
      ${escapeHtml(post.Title)}
    </h1>

    <div class="article-date">
      📅 ${formatDate(post.created_at)}
    </div>

    <div class="article-views">
      👁️
      ${Number(post.views || 0).toLocaleString()}
      views
    </div>

    ${media}

    <div class="article-content">
      ${escapeHtml(post.Content)}
    </div>

  `;

  modal.style.display = "block";

  document.body.style.overflow =
    "hidden";

  history.replaceState(
    null,
    "",
    `#post-${post.id}`
  );

}


/* =========================
   CLOSE ARTICLE
========================= */

function closeArticle(){

  document.getElementById(
    "articleModal"
  ).style.display = "none";

  document.body.style.overflow =
    "";

  if(
    location.hash.startsWith("#post-")
  ){

    history.replaceState(
      null,
      "",
      location.pathname +
      location.search
    );

  }

}


document.getElementById(
  "articleModal"
).addEventListener(
  "click",
  function(e){

/* =========================
   LIKE
========================= */

async function likePost(
  postId,
  button
){

  const visitorId =
    getVisitorId();

  const { data: existing } =
    await supabaseClient
    .from("post_likes")
    .select("id")
    .eq("post_id",postId)
    .eq("visitor_id",visitorId)
    .maybeSingle();

  if(existing){

    await supabaseClient
    .from("post_likes")
    .delete()
    .eq("id",existing.id);

    button.innerHTML =
      "👍 <span>0</span>";

  }else{

    await supabaseClient
    .from("post_likes")
    .insert({
      post_id:postId,
      visitor_id:visitorId
    });

    button.innerHTML =
      "❤️ <span>1</span>";

  }

  loadLikeCount(
    postId,
    button
  );

}


async function loadLikeCount(
  postId,
  button
){

  const { count } =
    await supabaseClient
    .from("post_likes")
    .select("*",{
      count:"exact",
      head:true
    })
    .eq("post_id",postId);

  button.innerHTML =
    `👍 <span>${count || 0}</span>`;

}


/* =========================
   VISITOR ID
========================= */

function getVisitorId(){

  let id =
    localStorage.getItem(
      "mk_visitor_id"
    );

  if(!id){

    id =
      crypto.randomUUID();

    localStorage.setItem(
      "mk_visitor_id",
      id
    );

  }

  return id;

}


/* =========================
   COMMENTS
========================= */

function toggleComments(postId){

  const box =
    document.getElementById(
      `comments-${postId}`
    );

  box.style.display =
    box.style.display === "block"
      ? "none"
      : "block";

  if(box.style.display === "block"){

    loadComments(postId);

  }

}


async function submitComment(postId){

  const name =
    document.getElementById(
      `name-${postId}`
    ).value.trim();

  const comment =
    document.getElementById(
      `comment-${postId}`
    ).value.trim();

  if(!name || !comment){

    alert(
      "Ka cika sunanka da comment."
    );

    return;

  }

  const visitorId =
    getVisitorId();

  const { error } =
    await supabaseClient
    .from("post_comments")
    .insert({
      post_id:postId,
      visitor_id:visitorId,
      name:name,
      comment:comment
    });

  if(error){

    console.error(error);

    alert(
      "An kasa tura comment."
    );

    return;

  }

  document.getElementById(
    `name-${postId}`
  ).value = "";

  document.getElementById(
    `comment-${postId}`
  ).value = "";

  loadComments(postId);

}


async function loadComments(postId){

  const list =
    document.getElementById(
      `comments-list-${postId}`
    );

  const countElement =
    document.getElementById(
      `comment-count-${postId}`
    );

  const { data, error } =
    await supabaseClient
    .from("post_comments")
    .select(
      "id,name,comment,created_at"
    )
    .eq("post_id",postId)
    .order(
      "created_at",
      {
        ascending:false
      }
    );

  if(error){

    console.error(error);

    return;

  }

  countElement.textContent =
    data.length;

  list.innerHTML =
    data.map(
      c => `

        <div class="comment-item">

          <div class="comment-name">
            ${escapeHtml(c.name)}
          </div>

          <div>
            ${escapeHtml(c.comment)}
          </div>

        </div>

      `
    ).join("");

}


/* =========================
   SHARE
========================= */

async function sharePost(postId){

  const post =
    allPosts.find(
      p => Number(p.id) === Number(postId)
    );

  if(!post){

    return;

  }

  const url =
    `${location.origin}${location.pathname}#post-${post.id}`;

  const shareData = {

    title:post.Title,

    text:
      `${post.Title}\n\nMK Youth Mobilizers Media`,

    url:url

  };

  if(
    navigator.share
  ){

    try{

      await navigator.share(
        shareData
      );

      return;

    }catch(e){}

  }

  try{

    await navigator.clipboard.writeText(
      url
    );

    alert(
      "An kwafi link din post."
    );

  }catch(e){

    window.open(
      `https://wa.me/?text=${encodeURIComponent(
        post.Title + "\n" + url
      )}`,
      "_blank"
    );

  }

}


/* =========================
   HELPERS
========================= */

function formatDate(dateString){

  if(!dateString){

    return "";

  }

  const date =
    new Date(dateString);

  return date.toLocaleString(
    "ha-NG",
    {
      day:"2-digit",
      month:"long",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function makePreview(
  text,
  words
){

  if(!text){

    return "";

  }

  const arr =
    text.trim().split(/\s+/);

  if(arr.length <= words){

    return text;

  }

  return (
    arr.slice(0,words).join(" ")
    + "..."
  );

}


function isVideo(url){

  if(!url){

    return false;

  }

  const clean =
    url.split("?")[0].toLowerCase();

  return (
    clean.endsWith(".mp4") ||
    clean.endsWith(".webm") ||
    clean.endsWith(".mov") ||
    clean.endsWith(".m4v")
  );

}


function escapeHtml(value){

  if(value === null ||
     value === undefined){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

   HASH OPEN
========================= */

function openHashPost(){

  if(
    location.hash.startsWith("#post-")
  ){

    const id =
      location.hash.replace(
        "#post-",
        ""
      );

    const post =
      allPosts.find(
        p => String(p.id) === String(id)
      );

    if(post){

      openArticle(post);

    }

  }

}


/* =========================
   START
========================= */

async function start(){

  await countVisitor();

  await loadLive();

  await loadPosts();

  document
  .querySelectorAll(".post-card")
  .forEach(card => {

    const id =
      card.id.replace(
        "post-",
        ""
      );

    const post =
      allPosts.find(
        p => String(p.id) === String(id)
      );

    if(!post){

      return;

    }

    const likeButton =
      card.querySelector(
        ".action-btn"
      );

    if(likeButton){

      loadLikeCount(
        post.id,
        likeButton
      );

    }

    const commentCount =
      card.querySelector(
        `#comment-count-${post.id}`
      );

    if(commentCount){

      loadCommentCount(
        post.id,
        commentCount
      );

    }

  });

  openHashPost();

}


async function loadCommentCount(
  postId,
  element
){

  const { count } =
    await supabaseClient
    .from("post_comments")
    .select("*",{
      count:"exact",
      head:true
    })
    .eq("post_id",postId);

  element.textContent =
    count || 0;

}


start();
