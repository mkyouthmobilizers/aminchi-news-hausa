<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MK Youth Mobilizers Media Team Tarauni</title>

<meta
  name="description"
  content="MK Youth Mobilizers Media Team Tarauni - Latest news, updates, photos and videos."
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

/* HEADER */

header{
  background:#111827;
  color:white;
  padding:14px 16px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.header-inner{
  max-width:1050px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:white;
}

.site-name{
  font-size:19px;
  font-weight:bold;
}

.site-subtitle{
  font-size:12px;
  opacity:.75;
  margin-top:3px;
}

/* MAIN */

.container{
  max-width:1050px;
  margin:auto;
  padding:20px 12px 50px;
}

/* VISITOR */

.visitor-box{
  background:white;
  border-radius:10px;
  padding:13px 16px;
  margin-bottom:20px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  font-weight:bold;
}

/* LIVE */

.live-box{
  background:white;
  border-radius:12px;
  margin-bottom:20px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.live-header{
  padding:14px 16px;
  font-weight:bold;
  border-bottom:1px solid #eee;
}

.live-status{
  padding:8px 16px;
  font-size:13px;
  color:#666;
}

.live-video{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  display:none;
}

/* NEWS */

.section-title{
  font-size:23px;
  font-weight:bold;
  margin:8px 0 15px;
}

.posts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.post-card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.2s;
}

.post-card:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 16px rgba(0,0,0,.13);
}

.post-media{
  width:100%;
  height:210px;
  object-fit:cover;
  display:block;
  background:#ddd;
}

.post-info{
  padding:15px;
}

.post-title{
  font-size:19px;
  line-height:1.3;
  margin-bottom:8px;
}

.post-date{
  color:#777;
  font-size:12px;
  margin-bottom:10px;
}

.post-preview{
  color:#444;
  font-size:14px;
  line-height:1.5;
}

.read-more{
  display:inline-block;
  margin-top:12px;
  font-weight:bold;
  color:#075985;
  font-size:14px;
}

/* ARTICLE */

.article-page{
  display:none;
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.article-content{
  padding:20px;
}

.article-media{
  width:100%;
  max-height:600px;
  object-fit:contain;
  background:#111;
  display:block;
  margin-bottom:20px;
}

.article-title{
  font-size:30px;
  line-height:1.25;
  margin-bottom:10px;
}

.article-date{
  color:#777;
  font-size:13px;
  margin-bottom:20px;
}

.article-text{
  white-space:pre-line;
  font-size:17px;
  line-height:1.8;
  color:#222;
}

.back-button{
  display:inline-block;
  margin-bottom:15px;
  padding:10px 15px;
  border:0;
  border-radius:8px;
  background:#111827;
  color:white;
  cursor:pointer;
  font-size:14px;
}

/* LOADING */

.loading,
.empty,
.error{
  background:white;
  padding:25px;
  border-radius:10px;
  text-align:center;
}

.error{
  color:#b91c1c;
}

/* FOOTER */

footer{
  background:#111827;
  color:white;
  margin-top:30px;
  padding:25px 15px;
  text-align:center;
}

.footer-title{
  font-weight:bold;
  margin-bottom:8px;
}

.footer-text{
  font-size:13px;
  opacity:.75;
  line-height:1.5;
}

/* MOBILE */

@media(max-width:800px){

  .posts{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .container{
    padding:15px 10px 40px;
  }

  .posts{
    grid-template-columns:1fr;
  }

  .post-media{
    height:230px;
  }

  .article-title{
    font-size:25px;
  }

  .article-text{
    font-size:16px;
  }

  .site-name{
    font-size:16px;
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

  <div class="header-inner">

    <img
      src="IMG_3240.jpeg"
      class="logo"
      alt="MK Youth Mobilizers"
    >

    <div>

      <div class="site-name">
        MK Youth Mobilizers
      </div>

      <div class="site-subtitle">
        Media Team Tarauni
      </div>

    </div>

  </div>

</header>


<main class="container">


<!-- VISITOR COUNTER -->

<div class="visitor-box">

  👥 Website Visitors:
  <span id="visitorCount">10,000</span>

</div>


<!-- YOUTUBE LIVE -->

<div class="live-box">

  <div class="live-header">
    🔴 YouTube LIVE
  </div>

  <div
    id="liveStatus"
    class="live-status"
  >
    Checking live status...
  </div>

  <iframe
    id="liveVideo"
    class="live-video"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>

</div>


<!-- NEWS -->

<section id="newsPage">

  <div class="section-title">
    📰 Latest News
  </div>

  <div
    id="posts"
    class="posts"
  >

    <div class="loading">
      Loading posts...
    </div>

  </div>

</section>


<!-- FULL ARTICLE -->

<section
  id="articlePage"
  class="article-page"
>

  <div class="article-content">

    <button
      id="backButton"
      class="back-button"
    >
      ← Back to News
    </button>

    <div id="articleContainer"></div>

  </div>

</section>


</main>


<!-- FOOTER -->

<footer>

  <div class="footer-title">
    MK Youth Mobilizers Media Team Tarauni
  </div>

  <div class="footer-text">
    Connecting, inspiring and empowering young people.
    <br>
    © 2026 MK Youth Mobilizers. All rights reserved.
  </div>

</footer>


<script>

/* =========================================
   SUPABASE CONFIGURATION
========================================= */

const SUPABASE_URL =
"https://kszficrcngxipcllezgl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hsMkfMvXMbAXXt8Z7LvAvg_52miDaJe";

const BUCKET =
"post-media";

const client =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const postsContainer =
document.getElementById("posts");

const visitorCount =
document.getElementById("visitorCount");

const liveStatus =
document.getElementById("liveStatus");

const liveVideo =
document.getElementById("liveVideo");

const newsPage =
document.getElementById("newsPage");

const articlePage =
document.getElementById("articlePage");

const articleContainer =
document.getElementById("articleContainer");

const backButton =
document.getElementById("backButton");


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(dateString){

  if(!dateString){
    return "";
  }

  const date =
    new Date(dateString);

  if(isNaN(date.getTime())){
    return "";
  }

  return date.toLocaleString(
    "en-GB",
    {
      day:"numeric",
      month:"long",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================================
   SHORT CONTENT
========================================= */

function shortText(text){

  if(!text){
    return "";
  }

  const maxLength = 150;

  if(text.length <= maxLength){
    return text;
  }

  return text.substring(
    0,
    maxLength
  ) + "...";

}


/* =========================================
   CHECK VIDEO
========================================= */

function isVideo(url){

  if(!url){
    return false;
  }

  const lower =
    url.toLowerCase();

  return (
    lower.includes(".mp4") ||
    lower.includes(".webm") ||
    lower.includes(".mov") ||
    lower.includes(".m4v")
  );

}


/* =========================================
   LOAD POSTS
========================================= */

async function loadPosts(){

  postsContainer.innerHTML =
    '<div class="loading">Loading posts...</div>';

  try{

    const result =
      await client
      .from("posts")
      .select(
        "id,Title,Content,Image_url,created_at"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .order(
        "id",
        {
          ascending:false
        }
      );


    if(result.error){

      console.error(
        "Posts error:",
        result.error
      );

      postsContainer.innerHTML =
        '<div class="error">❌ Unable to load posts.</div>';

      return;

    }


    const posts =
      result.data || [];


    if(posts.length === 0){

      postsContainer.innerHTML =
        '<div class="empty">No posts yet.</div>';

      return;

    }


    postsContainer.innerHTML =
      "";


    posts.forEach(
      function(post){

        const card =
          document.createElement("article");

        card.className =
          "post-card";


        /* MEDIA */

        if(post.Image_url){

          if(
            isVideo(
              post.Image_url
            )
          ){

            const video =
              document.createElement("video");

            video.className =
              "post-media";

            video.src =
              post.Image_url;

            video.controls =
              true;

            video.preload =
              "metadata";

            card.appendChild(
              video
            );

          }else{

            const img =
              document.createElement("img");

            img.className =
              "post-media";

            img.src =
              post.Image_url;

            img.alt =
              post.Title ||
              "Post";

            img.loading =
              "lazy";

            card.appendChild(
              img
            );

          }

        }


        /* POST INFO */

        const info =
          document.createElement("div");

        info.className =
          "post-info";


        const title =
          document.createElement("h2");

        title.className =
          "post-title";

        title.textContent =
          post.Title ||
          "Untitled";


        const date =
          document.createElement("div");

        date.className =
          "post-date";

        date.textContent =
          "📅 " +
          formatDate(
            post.created_at
          );


        const preview =
          document.createElement("div");

        preview.className =
          "post-preview";

        preview.textContent =
          shortText(
            post.Content
          );


        const readMore =
          document.createElement("div");

        readMore.className =
          "read-more";

        readMore.textContent =
          "Read full story →";


        info.appendChild(
          title
        );

        info.appendChild(
          date
        );

        info.appendChild(
          preview
        );

        info.appendChild(
          readMore
        );


        card.appendChild(
          info
        );


        /* OPEN POST */

        card.addEventListener(
          "click",
          function(event){

            if(
              event.target.tagName ===
              "VIDEO"
            ){
              return;
            }

            openArticle(
              post
            );

          }
        );


        postsContainer.appendChild(
          card
        );

      }
    );


  }catch(error){

    console.error(
      error
    );

    postsContainer.innerHTML =
      '<div class="error">❌ Something went wrong.</div>';

  }

}


/* =========================================
   OPEN FULL ARTICLE
========================================= */

function openArticle(post){

  newsPage.style.display =
    "none";

  articlePage.style.display =
    "block";

  articleContainer.innerHTML =
    "";


  /* MEDIA */

  if(post.Image_url){

    if(
      isVideo(
        post.Image_url
      )
    ){

      const video =
        document.createElement("video");

      video.className =
        "article-media";

      video.src =
        post.Image_url;

      video.controls =
        true;

      articleContainer.appendChild(
        video
      );

    }else{

      const img =
        document.createElement("img");

      img.className =
        "article-media";

      img.src =
        post.Image_url;

      img.alt =
        post.Title ||
        "Post";

      articleContainer.appendChild(
        img
      );

    }

  }


  /* TITLE */

  const title =
    document.createElement("h1");

  title.className =
    "article-title";

  title.textContent =
    post.Title ||
    "Untitled";


  /* DATE */

  const date =
    document.createElement("div");

  date.className =
    "article-date";

  date.textContent =
    "📅 Published: " +
    formatDate(
      post.created_at
    );


  /* CONTENT */

  const content =
    document.createElement("div");

  content.className =
    "article-text";

  content.textContent =
    post.Content ||
    "";


  articleContainer.appendChild(
    title
  );

  articleContainer.appendChild(
    date
  );

  articleContainer.appendChild(
    content
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
   BACK TO NEWS
========================================= */

backButton.addEventListener(
  "click",
  function(){

    articlePage.style.display =
      "none";

    newsPage.style.display =
      "block";

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }
);


/* =========================================
   VISITOR COUNTER
========================================= */

async function updateVisitorCounter(){

  const STARTING_VISITORS =
    10000;


  visitorCount.textContent =
    STARTING_VISITORS.toLocaleString();


  try{

    /*
      Check whether this browser
      has already been counted.
    */

    const alreadyCounted =
      localStorage.getItem(
        "mk_visitor_counted"
      );


    /*
      Count this visitor only once
      on this browser.
    */

    if(!alreadyCounted){

      const insertResult =
        await client
        .from("visitors")
        .insert({});


      if(insertResult.error){

        console.error(
          "Visitor insert error:",
          insertResult.error
        );

      }else{

        localStorage.setItem(
          "mk_visitor_counted",
          "true"
        );

      }

    }


    /*
      Get total real visitors
      from Supabase.
    */

    const countResult =
      await client
      .from("visitors")
      .select(
        "*",
        {
          count:"exact",
          head:true
        }
      );


    if(countResult.error){

      console.error(
        "Visitor count error:",
        countResult.error
      );

      /*
        Even if Supabase fails,
        keep 10,000 visible.
      */

      visitorCount.textContent =
        STARTING_VISITORS.toLocaleString();

      return;

    }


    const realVisitors =
      Number(
        countResult.count || 0
      );


    const totalVisitors =
      STARTING_VISITORS +
      realVisitors;


    visitorCount.textContent =
      totalVisitors.toLocaleString();


  }catch(error){

    console.error(
      "Visitor error:",
      error
    );

    visitorCount.textContent =
      STARTING_VISITORS.toLocaleString();

  }

}


/* =========================================
   LOAD YOUTUBE LIVE
========================================= */

async function loadLive(){

  try{

    const result =
      await client
      .from("live_stream")
      .select(
        "id,youtube_id,active"
      )
      .eq(
        "id",
        1
      )
      .maybeSingle();


    if(result.error){

      console.error(
        "Live error:",
        result.error
      );

      liveStatus.textContent =
        "Live system unavailable.";

      return;

    }


    const data =
      result.data;


    if(
      data &&
      data.active &&
      data.youtube_id
    ){

      liveStatus.textContent =
        "🔴 LIVE IS ACTIVE";


      liveVideo.src =
        "https://www.youtube.com/embed/" +
        data.youtube_id +
        "?autoplay=1";


      liveVideo.style.display =
        "block";

    }else{

      liveStatus.textContent =
        "Live is currently OFF";


      liveVideo.style.display =
        "none";

    }


  }catch(error){

    console.error(
      error
    );

    liveStatus.textContent =
      "Live system unavailable.";

  }

}


/* =========================================
   START WEBSITE
========================================= */

loadPosts();

loadLive();

updateVisitorCounter();

</script>

</body>
</html>
