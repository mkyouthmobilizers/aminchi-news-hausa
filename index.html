<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;

body{

header{

.logo{

.header-title{

.header-subtitle{

.container{

.visitor-box{

  text-align:center;

.live-box{

.post{

.post-header{
  display:flex;
  align-items:center;
  padding:12px;

}

.author-img{

  border-radius:50%;

  border:1px solid #ddd;
}

.author-name{
  font-weight:bold;
  font-size:14px;
}

.post-date{

}

.post-media{
  width:100%;
  display:block;
  max-height:520px;

  background:#000;
}

.post-body{

}

.post-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:8px;

.post-content{

  line-height:1.55;
  font-size:15px;
}

.read-more{
  border:0;
  background:none;
  color:#1877f2;
  font-weight:bold;
  cursor:pointer;
  padding:6px 0;
  font-size:14px;
}

.actions{
  display:flex;
  border-top:1px solid #eee;
  margin-top:12px;
}

.action-btn{
  flex:1;
  border:0;
  background:white;
  padding:12px 5px;
  font-size:14px;
  cursor:pointer;
  font-weight:bold;
}

.action-btn:hover{
  background:#f3f4f6;
}

.like-btn.liked{
  color:#1877f2;
}

.comments{
  display:none;
  border-top:1px solid #eee;
  padding:12px;
  background:#fafafa;
}

.comments.show{
  display:block;
}

.comment-form input,
.comment-form textarea{
  width:100%;
  border:1px solid #ccc;
  border-radius:8px;
  padding:11px;
  margin-bottom:8px;
  font-family:inherit;
  font-size:14px;
  outline:none;
}

.comment-form input:focus,
.comment-form textarea:focus{
  border-color:#1877f2;
}

.comment-form textarea{
  min-height:80px;
  resize:vertical;
}

.comment-submit{
  width:100%;
  border:0;
  border-radius:8px;
  padding:11px;
  background:#111827;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.comment-submit:disabled{
  opacity:.6;
}

.comment-list{
  margin-top:12px;
}

.comment{
  background:white;
  border-radius:8px;
  padding:10px;
  margin-bottom:8px;
}

.comment-name{
  font-weight:bold;
  font-size:13px;
}

.comment-text{
  margin-top:4px;
  font-size:14px;
  line-height:1.4;
}

.comment-date{
  color:#888;
  font-size:11px;
  margin-top:5px;
}

.empty-comments{
  color:#777;
  font-size:13px;
  margin-top:10px;
}

.article{
  display:none;
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.back-btn{
  border:0;
  background:#111827;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  margin-bottom:15px;
  cursor:pointer;
  font-weight:bold;
}

.article-title{
  font-size:28px;
  margin-bottom:10px;
}

.article-date{
  color:#777;
  font-size:13px;
  margin-bottom:18px;
}

.article-content{
  white-space:pre-wrap;
  line-height:1.7;
  font-size:17px;
}

.article-body{
  padding:18px;
}

.article-actions{
  display:flex;
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
  margin:18px 0;
}

.article-action{
  flex:1;
  border:0;
  background:white;
  padding:13px;
  font-weight:bold;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#777;
  font-size:13px;
}

@media(max-width:700px){

  .posts{
    grid-template-columns:1fr;
  }

  .container{
    padding:10px;
  }

  .article-title{
    font-size:23px;
  }

}

<header>

    <img

    <div>
      <div class="header-title">

      </div>

</header>


<div class="container">

  <div class="visitor-box">

<footer>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://kszficrcngxipcllezgl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hsMkfMvXMbAXXt8Z7LvAvg_52miDaJe";

const client =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const postsContainer =
document.getElementById("posts");

const visitorCount =
document.getElementById("visitorCount");

const liveStatus =
document.getElementById("liveStatus");

const liveContainer =
document.getElementById("liveContainer");

const newsSection =
document.getElementById("newsSection");

const articleSection =
document.getElementById("articleSection");

const articleContent =
document.getElementById("articleContent");


/* =========================
   VISITOR ID
========================= */

function getVisitorId(){

  let id =
  localStorage.getItem("mk_visitor_id");

  if(!id){

    if(
      window.crypto &&
      crypto.randomUUID
    ){

      id = crypto.randomUUID();

    }else{

      id =
      Date.now() +
      "-" +
      Math.random()
      .toString(36)
      .substring(2);

    }

    localStorage.setItem(
      "mk_visitor_id",
      id
    );

  }

  return id;
}


/* =========================
   VISITOR COUNTER
========================= */

async function updateVisitorCounter(){

  const STARTING_VISITORS = 10000;

  visitorCount.textContent =
  STARTING_VISITORS.toLocaleString();


  try{

    const alreadyCounted =
    localStorage.getItem(
      "mk_visitor_counted"
    );


    if(!alreadyCounted){

      const insertResult =
      await client
      .from("visitors")
      .insert({});


      if(!insertResult.error){

        localStorage.setItem(
          "mk_visitor_counted",
          "true"
        );

      }

    }


    const countResult =
    await client
    .from("visitors")
    .select("*",{
      count:"exact",
      head:true
    });


    if(countResult.error){

      return;

    }


    const realVisitors =
    Number(countResult.count || 0);


    visitorCount.textContent =
    (
      STARTING_VISITORS +
      realVisitors
    ).toLocaleString();


  }catch(error){

    console.error(error);

  }

}


/* =========================
   DATE
========================= */

function formatDate(date){

  if(!date) return "";

  return new Date(date)
  .toLocaleString(
    "en-GB",
    {
      day:"numeric",
      month:"long",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================
   VIDEO
========================= */

function isVideo(url){

  if(!url) return false;

  const clean =
  url.split("?")[0].toLowerCase();

  return (
    clean.endsWith(".mp4") ||
    clean.endsWith(".webm") ||
    clean.endsWith(".mov") ||
    clean.endsWith(".m4v")
  );

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(text){

  const div =
  document.createElement("div");

  div.textContent =
  text || "";

  return div.innerHTML;

}


/* =========================
   SHORT STORY
========================= */

function shortStory(text){

  if(!text) return "";

  const words =
  text.trim().split(/\s+/);

  if(words.length <= 35){

    return text;

  }

  return (
    words.slice(0,35).join(" ") +
    "..."
  );

}


/* =========================
   POSTS
========================= */

let allPosts = [];


async function loadPosts(){

  postsContainer.innerHTML =
  "Loading posts...";


  const result =
  await client
  .from("posts")
  .select(
    "id,Title,Content,Image_url,created_at"
  )
  .order(
    "created_at",
    {ascending:false}
  )
  .order(
    "id",
    {ascending:false}
  );


  if(result.error){

    console.error(result.error);

    postsContainer.innerHTML =
    "<p>Unable to load posts.</p>";

    return;

  }


  allPosts =
  result.data || [];


  if(!allPosts.length){

    postsContainer.innerHTML =
    "<p>No posts yet.</p>";

    return;

  }


  postsContainer.innerHTML = "";


  allPosts.forEach(
    post => {

      const card =
      createPostCard(post);

      postsContainer.appendChild(
        card
      );

      loadEngagement(
        post,
        card
      );

    }
  );


  if(
    window.location.hash
    .startsWith("#post-")
  ){

    const id =
    Number(
      window.location.hash
      .replace("#post-","")
    );

    const post =
    allPosts.find(
      p => Number(p.id) === id
    );

    if(post){

      openArticle(post);

    }

  }

}


/* =========================
   CREATE POST
========================= */

function createPostCard(post){

  const card =
  document.createElement("article");

  card.className =
  "post";


  const header =
  document.createElement("div");

  header.className =
  "post-header";


  header.innerHTML = `

    <img
      src="561F33DB-6D50-45C9-8940-5E77FF098DDE.png"
      class="author-img"
      alt="MK Youth Mobilizers">

    <div>

      <div class="author-name">
        MK Youth Mobilizers
      </div>

      <div class="post-date">
        ${escapeHtml(
          formatDate(post.created_at)
        )}
      </div>

    </div>

  `;


  card.appendChild(header);


  /* MEDIA */

  if(post.Image_url){

    if(isVideo(post.Image_url)){

      const video =
      document.createElement("video");

      video.className =
      "post-media";

      video.src =
      post.Image_url;

      video.controls =
      true;

      video.playsInline =
      true;

      video.addEventListener(
        "click",
        e => e.stopPropagation()
      );

      card.appendChild(video);

    }else{

      const img =
      document.createElement("img");

      img.className =
      "post-media";

      img.src =
      post.Image_url;

      img.alt =
      post.Title || "Post";

      img.loading =
      "lazy";

      img.addEventListener(
        "click",
        e => {

          e.stopPropagation();

          openArticle(post);

        }
      );

      card.appendChild(img);

    }

  }


  /* BODY */

  const body =
  document.createElement("div");

  body.className =
  "post-body";


  const title =
  document.createElement("div");

  title.className =
  "post-title";

  title.textContent =
  post.Title || "";


  const content =
  document.createElement("div");

  content.className =
  "post-content";

  const fullText =
  post.Content || "";

  const words =
  fullText.trim().split(/\s+/);


  if(words.length > 35){

    content.textContent =
    shortStory(fullText);


    const readMore =
    document.createElement("button");

    readMore.className =
    "read-more";

    readMore.textContent =
    "Read more";


    readMore.addEventListener(
      "click",
      e => {

        e.stopPropagation();

        openArticle(post);

      }
    );


    body.appendChild(title);

    body.appendChild(content);

    body.appendChild(readMore);

  }else{

    content.textContent =
    fullText;

    body.appendChild(title);

    body.appendChild(content);

  }


  /* ACTIONS */

  const actions =
  document.createElement("div");

  actions.className =
  "actions";


  const likeBtn =
  document.createElement("button");

  likeBtn.className =
  "action-btn like-btn";

  likeBtn.innerHTML =
  "👍 Like <span>0</span>";


  likeBtn.addEventListener(
    "click",
    async e => {

      e.stopPropagation();

      await toggleLike(
        post,
        likeBtn
      );

    }
  );


  const commentBtn =
  document.createElement("button");

  commentBtn.className =
  "action-btn";

  commentBtn.innerHTML =
  "💬 Comment <span>0</span>";


  commentBtn.addEventListener(
    "click",
    e => {

      e.stopPropagation();

      const box =
      card.querySelector(
        ".comments"
      );

      box.classList.add("show");

      const input =
      box.querySelector(
        ".comment-name"
      );

      if(input){

        input.focus();

      }

    }
  );


  const shareBtn =
  document.createElement("button");

  shareBtn.className =
  "action-btn";

  shareBtn.innerHTML =
  "🔄 Share";


  shareBtn.addEventListener(
    "click",
    e => {

      e.stopPropagation();

      sharePost(post);

    }
  );


  actions.appendChild(
    likeBtn
  );

  actions.appendChild(
    commentBtn
  );

  actions.appendChild(
    shareBtn
  );


  body.appendChild(
    actions
  );


  /* COMMENTS */

  const comments =
  createCommentsSection(
    post,
    commentBtn
  );


  body.appendChild(
    comments
  );


  card.appendChild(
    body
  );


  /* OPEN FULL POST */

  card.addEventListener(
    "click",
    () => openArticle(post)
  );


  return card;

}


/* =========================
   ENGAGEMENT
========================= */

async function loadEngagement(
  post,
  card
){

  const likeBtn =
  card.querySelector(
    ".like-btn"
  );


  const commentBtn =
  card.querySelector(
    ".action-btn:nth-child(2)"
  );


  /* LIKE COUNT */

  const likes =
  await client
  .from("post_likes")
  .select(
    "id",
    {
      count:"exact",
      head:true
    }
  )
  .eq(
    "post_id",
    post.id
  );


  if(!likes.error){

    likeBtn.querySelector(
      "span"
    ).textContent =
    likes.count || 0;

  }


  /* CHECK LIKE */

  const liked =
  await client
  .from("post_likes")
  .select("id")
  .eq(
    "post_id",
    post.id
  )
  .eq(
    "visitor_id",
    getVisitorId()
  )
  .maybeSingle();


  if(
    !liked.error &&
    liked.data
  ){

    likeBtn.classList.add(
      "liked"
    );

  }


  /* COMMENT COUNT */

  const comments =
  await client
  .from("post_comments")
  .select(
    "id",
    {
      count:"exact",
      head:true
    }
  )
  .eq(
    "post_id",
    post.id
  );


  if(!comments.error){

    commentBtn.querySelector(
      "span"
    ).textContent =
    comments.count || 0;

  }


  loadComments(
    post,
    card
  );

}


/* =========================
   LIKE
========================= */

async function toggleLike(
  post,
  button
){

  const visitorId =
  getVisitorId();


  const existing =
  await client
  .from("post_likes")
  .select("id")
  .eq(
    "post_id",
    post.id
  )
  .eq(
    "visitor_id",
    visitorId
  )
  .maybeSingle();


  if(existing.error){

    alert(
      "Unable to check Like."
    );

    return;

  }


  if(existing.data){

    const result =
    await client
    .from("post_likes")
    .delete()
    .eq(
      "id",
      existing.data.id
    );


    if(result.error){

      alert(
        "Unable to remove Like."
      );

      return;

    }


    button.classList.remove(
      "liked"
    );


  }else{

    const result =
    await client
    .from("post_likes")
    .insert({

      post_id:post.id,

      visitor_id:visitorId

    });


    if(result.error){

      console.error(
        result.error
      );

      alert(
        "Unable to Like this post."
      );

      return;

    }


    button.classList.add(
      "liked"
    );

  }


  const count =
  await client
  .from("post_likes")
  .select(
    "id",
    {
      count:"exact",
      head:true
    }
  )
  .eq(
    "post_id",
    post.id
  );


  if(!count.error){

    button.querySelector(
      "span"
    ).textContent =
    count.count || 0;

  }

}


/* =========================
   COMMENTS
========================= */

function createCommentsSection(
  post,
  commentBtn
){

  const section =
  document.createElement("div");

  section.className =
  "comments";


  const form =
  document.createElement("div");

  form.className =
  "comment-form";


  const name =
  document.createElement("input");

  name.className =
  "comment-name";

  name.placeholder =
  "Your name";


  const textarea =
  document.createElement("textarea");

  textarea.className =
  "comment-textarea";

  textarea.placeholder =
  "Write your comment...";


  const submit =
  document.createElement("button");

  submit.className =
  "comment-submit";

  submit.textContent =
  "Post Comment";


  submit.addEventListener(
    "click",
    async e => {

      e.stopPropagation();


      const userName =
      name.value.trim();

      const comment =
      textarea.value.trim();


      if(!userName){

        alert(
          "Please enter your name."
        );

        name.focus();

        return;

      }


      if(!comment){

        alert(
          "Please write your comment."
        );

        textarea.focus();

        return;

      }


      submit.disabled =
      true;

      submit.textContent =
      "Posting...";


      const result =
      await client
      .from("post_comments")
      .insert({

        post_id:post.id,

        visitor_id:
        getVisitorId(),

        name:userName,

        comment:comment

      });


      submit.disabled =
      false;

      submit.textContent =
      "Post Comment";


      if(result.error){

        console.error(
          result.error
        );

        alert(
          "Comment could not be posted."
        );

        return;

      }


      name.value =
      "";

      textarea.value =
      "";


      await loadComments(
        post,
        section.closest(".post")
      );


      const count =
      await client
      .from("post_comments")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "post_id",
        post.id
      );


      if(!count.error){

        commentBtn.querySelector(
          "span"
        ).textContent =
        count.count || 0;

      }

    }
  );


  form.appendChild(name);

  form.appendChild(textarea);

  form.appendChild(submit);


  section.appendChild(form);


  const list =
  document.createElement("div");

  list.className =
  "comment-list";


  section.appendChild(list);


  return section;

}


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(
  post,
  card
){

  if(!card) return;


  const list =
  card.querySelector(
    ".comment-list"
  );


  if(!list) return;


  const result =
  await client
  .from("post_comments")
  .select(
    "id,name,comment,created_at"
  )
  .eq(
    "post_id",
    post.id
  )
  .order(
    "created_at",
    {ascending:false}
  );


  if(result.error){

    console.error(
      result.error
    );

    return;

  }


  list.innerHTML = "";


  if(
    !result.data ||
    !result.data.length
  ){

    list.innerHTML =
    '<div class="empty-comments">No comments yet.</div>';

    return;

  }


  result.data.forEach(
    item => {

      const div =
      document.createElement(
        "div"
      );

      div.className =
      "comment";


      const name =
      document.createElement(
        "div"
      );

      name.className =
      "comment-name";

      name.textContent =
      item.name;


      const text =
      document.createElement(
        "div"
      );

      text.className =
      "comment-text";

      text.textContent =
      item.comment;


      const date =
      document.createElement(
        "div"
      );

      date.className =
      "comment-date";

      date.textContent =
      formatDate(
        item.created_at
      );


      div.appendChild(name);

      div.appendChild(text);

      div.appendChild(date);


      list.appendChild(div);

    }
  );

}


/* =========================
   SHARE
========================= */

async function sharePost(post){

  const shareUrl =
  window.location.origin +
  window.location.pathname +
  "#post-" +
  post.id;


  const shareData = {

    title:
    post.Title ||
    "MK Youth Mobilizers",

    text:
    post.Content
      ? post.Content.substring(0,180)
      : "MK Youth Mobilizers",

    url:shareUrl

  };


  if(navigator.share){

    try{

      await navigator.share(
        shareData
      );

      return;

    }catch(error){

      if(
        error.name ===
        "AbortError"
      ){

        return;

      }

    }

  }


  try{

    await navigator.clipboard.writeText(
      shareUrl
    );

    alert(
      "Post link copied successfully."
    );

  }catch(error){

    const whatsapp =
    "https://wa.me/?text=" +
    encodeURIComponent(
      shareData.title +
      "\n\n" +
      shareUrl
    );

    window.open(
      whatsapp,
      "_blank"
    );

  }

}


/* =========================
   FULL ARTICLE
========================= */

function openArticle(post){

  newsSection.style.display =
  "none";

  articleSection.style.display =
  "block";


  let media = "";


  if(post.Image_url){

    if(isVideo(post.Image_url)){

      media = `

        <video
          class="post-media"
          controls
          playsinline
          src="${escapeHtml(
            post.Image_url
          )}">
        </video>

      `;

    }else{

      media = `

        <img
          class="post-media"
          src="${escapeHtml(
            post.Image_url
          )}"
          alt="${escapeHtml(
            post.Title
          )}">

      `;

    }

  }


  articleContent.innerHTML = `

    ${media}

    <div class="article-body">

      <h1 class="article-title">
        ${escapeHtml(
          post.Title
        )}
      </h1>

      <div class="article-date">
        ${escapeHtml(
          formatDate(
            post.created_at
          )
        )}
      </div>

      <div class="article-content">
        ${escapeHtml(
          post.Content
        )}
      </div>

      <div class="article-actions">

        <button
          class="article-action"
          onclick="toggleArticleLike(${post.id})">

          👍 Like

        </button>

        <button
          class="article-action"
          onclick="focusArticleComment()">

          💬 Comment

        </button>

        <button
          class="article-action"
          onclick='sharePost(${JSON.stringify(post).replace(/'/g,"&#39;")})'>

          🔄 Share

        </button>

      </div>

      <div id="articleCommentBox"></div>

    </div>

  `;


  history.pushState(
    null,
    "",
    "#post-" + post.id
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   ARTICLE COMMENT
========================= */

function focusArticleComment(){

  const box =
  document.getElementById(
    "articleCommentBox"
  );

  if(!box) return;


  box.innerHTML = `

    <div class="comments show">

      <div class="comment-form">

        <input
          id="articleName"
          placeholder="Your name">

        <textarea
          id="articleText"
          placeholder="Write your comment..."></textarea>

        <button
          class="comment-submit"
          onclick="submitArticleComment()">

          Post Comment

        </button>

      </div>

    </div>

  `;


  document.getElementById(
    "articleName"
  ).focus();

}


async function submitArticleComment(){

  const id =
  Number(
    window.location.hash
    .replace("#post-","")
  );


  const name =
  document.getElementById(
    "articleName"
  ).value.trim();


  const comment =
  document.getElementById(
    "articleText"
  ).value.trim();


  if(!name){

    alert(
      "Please enter your name."
    );

    return;

  }


  if(!comment){

    alert(
      "Please write your comment."
    );

    return;

  }


  const result =
  await client
  .from("post_comments")
  .insert({

    post_id:id,

    visitor_id:
    getVisitorId(),

    name:name,

    comment:comment

  });


  if(result.error){

    console.error(
      result.error
    );

    alert(
      "Comment could not be posted."
    );

    return;

  }


  alert(
    "Comment posted successfully."
  );


  document.getElementById(
    "articleName"
  ).value = "";

  document.getElementById(
    "articleText"
  ).value = "";

}

   ARTICLE LIKE
========================= */

async function toggleArticleLike(id){

  const post =
  allPosts.find(
    p => Number(p.id) === id
  );

  if(post){

    const fakeButton =
    document.createElement("button");

    await toggleLike(
      post,
      fakeButton
    );

  }

}

/* =========================
   LIVE
========================= */

async function loadLive(){

  liveStatus.innerHTML =
  "Checking live status...";

  liveContainer.innerHTML =
  "";


  const result =
  await client
  .from("live_stream")
  .select(
    "id,youtube_id,active"
  )
  .eq(
    "id",
    1
  )
  .maybeSingle();


  if(result.error){

    console.error(
      result.error
    );

    liveStatus.innerHTML =
    "Unable to load Live status.";

    return;

  }


  const data =
  result.data;


  if(
    data &&
    data.active &&
    data.youtube_id
  ){

    liveStatus.innerHTML =
    '<span style="color:red;font-weight:bold;">🔴 LIVE NOW</span>';


    const iframe =
    document.createElement(
      "iframe"
    );

    iframe.className =
    "live-video";

    iframe.src =
    "https://www.youtube.com/embed/" +
    encodeURIComponent(
      data.youtube_id
    ) +
    "?autoplay=1";

    iframe.allow =
    "autoplay; encrypted-media; picture-in-picture";

    iframe.allowFullscreen =
    true;


    liveContainer.appendChild(
      iframe
    );

  }else{

    liveStatus.innerHTML =
    '<span class="live-off">🔴 Live is currently OFF</span>';

  }

}

updateVisitorCounter();
