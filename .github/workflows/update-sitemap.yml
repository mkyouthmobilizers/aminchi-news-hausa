name: Update Sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          from xml.sax.saxutils import escape

          supabase_url = os.environ["SUPABASE_URL"]
          supabase_key = os.environ["SUPABASE_KEY"]

          url = (
              supabase_url
              + "/rest/v1/posts"
              + "?select=id,created_at"
              + "&order=created_at.desc"
          )

          req = urllib.request.Request(
              url,
              headers={
                  "apikey": supabase_key,
                  "Authorization": "Bearer " + supabase_key
              }
          )

          with urllib.request.urlopen(req) as response:
              posts = json.loads(response.read().decode())

          base_url = "https://mkyouthmobilizers.github.io/aminchi-news-hausa"

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
              "",
              "  <url>",
              f"    <loc>{base_url}/</loc>",
              "    <changefreq>daily</changefreq>",
              "    <priority>1.0</priority>",
              "  </url>",
          ]

          for post in posts:
              post_id = str(post["id"])

              lines.extend([
                  "",
                  "  <url>",
                  f"    <loc>{base_url}/article.html?id={escape(post_id)}</loc>",
                  "    <changefreq>weekly</changefreq>",
                  "    <priority>0.8</priority>",
                  "  </url>",
              ])

          lines.append("")
          lines.append("</urlset>")

          with open("sitemap.xml", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          print(f"Generated sitemap with {len(posts)} articles.")
          PY

      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "No sitemap changes."
            exit 0
          fi

          git commit -m "Automatically update sitemap"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
