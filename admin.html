<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMINCHI NEWS HAUSA — Admin Dashboard</title>

<meta name="robots" content="noindex,nofollow">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f4f4;
  color:#111;
}

header{
  background:#c40000;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:24px;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:10px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.login-box{
  max-width:450px;
  margin:70px auto;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin:7px 0 14px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
}

textarea{
  min-height:180px;
  resize:vertical;
}

button{
  border:0;
  border-radius:7px;
  padding:11px 18px;
  cursor:pointer;
  font-weight:bold;
}

.btn-red{
  background:#c40000;
  color:white;
}

.btn-dark{
  background:#111;
  color:white;
}

.btn-green{
  background:#168a35;
  color:white;
}

.btn-gray{
  background:#777;
  color:white;
}

.btn-blue{
  background:#1769aa;
  color:white;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.stat strong{
  display:block;
  font-size:28px;
  color:#c40000;
  margin-top:8px;
}

.preview{
  max-width:300px;
  max-height:220px;
  margin-top:10px;
  border-radius:8px;
  display:none;
}

.news-item{
  border-bottom:1px solid #ddd;
  padding:15px 0;
}

.news-item:last-child{
  border-bottom:0;
}

.news-title{
  font-weight:bold;
  font-size:18px;
}

.news-meta{
  color:#666;
  font-size:13px;
  margin:6px 0;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.message{
  margin-top:10px;
  font-weight:bold;
}

.hide{
  display:none;
}

.live-box{
  border:2px solid #c40000;
}

.live-status{
  font-weight:bold;
  margin:10px 0;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin:10px 0;
}

.checkbox-row input{
  width:auto;
  margin:0;
}

.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .stats{
    grid-template-columns:1fr;
  }

  .container{
    padding:10px;
  }

  header h1{
    font-size:20px;
  }
}
</style>
</head>

<body>

<header>
  <h1>AMINCHI NEWS HAUSA — ADMIN DASHBOARD</h1>
</header>


<!-- LOGIN -->
<section id="loginSection" class="container">

  <div class="card login-box">

    <h2>Admin Login</h2>

    <p>
      Wannan shafin na Admin ne kawai.
    </p>

    <label>Email</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Email"
      autocomplete="email"
    >

    <label>Password</label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="btn-red"
      onclick="login()"
    >
      LOGIN
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>

</section>


<!-- ADMIN DASHBOARD -->
<section
  id="adminSection"
  class="container hide"
>

  <div class="card">

    <div class="top-actions">

      <div>
        <h2>Welcome, Admin</h2>

        <div id="adminEmailDisplay"></div>
      </div>

      <button
        class="btn-dark"
        onclick="logout()"
      >
        LOGOUT
      </button>

    </div>

  </div>


  <!-- STATISTICS -->

  <div class="stats">

    <div class="stat">
      Total News
      <strong id="totalNews">0</strong>
    </div>

    <div class="stat">
      Breaking
      <strong id="totalBreaking">0</strong>
    </div>

    <div class="stat">
      Featured
      <strong id="totalFeatured">0</strong>
    </div>

    <div class="stat">
      Total Views

    </div>

  <!-- ADD / EDIT POST -->

  <div class="card">

    <h2 id="formTitle">

    >

    <label>Title</label>

    <input
      type="text"
      id="postTitle"

    >

    <label>Category</label>

    <select id="postCategory">

      <option value="Labarai">
        Labarai
      </option>

      <option value="Siyasa">
        Siyasa
      </option>

      <option value="Wasanni">
        Wasanni
      </option>

      <option value="Nishaɗi">
        Nishaɗi
      </option>

      <option value="Hotuna">
        Hotuna
      </option>

      <option value="Bidiyo">
        Bidiyo
      </option>

    </select>


    <label>Content</label>

    <textarea
      id="postContent"
      placeholder="Rubuta cikakken labari..."
    ></textarea>


    <label>Hoton Labari</label>

    <input
      type="file"
      id="postImage"
      accept="image/*"
      onchange="previewImage(event)"
    >

      alt="Preview"
    >


    <div class="checkbox-row">

      <input
        type="checkbox"
        id="breakingNews"
      >

      <label for="breakingNews">
        Breaking News

    <div class="checkbox-row">

      <input
        type="checkbox"
        id="featuredNews"
      >

      <label for="featuredNews">
        Featured News
      </label>

    </div>


    <div class="actions">

      <button
        class="btn-red"
        onclick="savePost()"

        PUBLISH / SAVE
      </button>

        onclick="resetForm()"
      >
        CLEAR
      </button>

    </div>


    <div
      id="postMessage"
      class="message"
    ></div>

  </div>


  <!-- ALL NEWS -->

  <div class="card">

    <h2>All News</h2>

    <input
      type="text"
      id="searchNews"
      placeholder="Search news..."
      oninput="filterPosts()"
    >

    <div id="postsList">
      Loading...
    </div>

  </div>


  <!-- YOUTUBE LIVE -->

  <div class="card live-box">

    <h2>🔴 YouTube LIVE</h2>

    <p>
      Saka YouTube Live link ɗinka a nan.
    </p>

    <input
      type="url"
      id="liveUrl"
      placeholder="https://www.youtube.com/watch?v=..."
    >

    <div
      id="liveStatus"
      class="live-status"
    >
      Loading...
    </div>

    <div class="actions">

      <button
        class="btn-red"
        onclick="activateLive()"
      >
        ACTIVATE LIVE
      </button>

      <button
        class="btn-dark"
        onclick="endLive()"
      >
        END LIVE
      </button>

    </div>

    <div
      id="liveMessage"
      class="message"
    ></div>

  </div>

</section>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://kszficrcngxipcllezgl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hsMkfMvXMbAXXt8Z7LvAvg_52miDaJe";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   ADMIN EMAIL
===================================================== */

const ADMIN_EMAIL =
"officialsyouseep@gmail.com";


let currentUser = null;

let allPosts = [];


/* =====================================================
   CHECK AUTH
===================================================== */

async function checkAuth(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient
  .auth
  .getSession();


  if(session){

    const email =
      session.user.email || "";


    /*
      IMPORTANT:
      Only the official admin email
      can enter the dashboard.
    */

    if(
      email.toLowerCase()
      !==
      ADMIN_EMAIL.toLowerCase()
    ){

      await supabaseClient
        .auth
        .signOut();

      showLogin();

      document.getElementById(
        "loginMessage"
      ).style.color =
        "#c40000";

      document.getElementById(
        "loginMessage"
      ).innerText =
        "Ba ka da izinin shiga Admin.";

      return;
    }


    currentUser =
      session.user;

    showAdmin();

  }else{

    showLogin();

  }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document
    .getElementById("loginEmail")
    .value
    .trim();


  const password =
    document
    .getElementById("loginPassword")
    .value;


  const message =
    document
    .getElementById("loginMessage");


  if(!email || !password){

    message.style.color =
      "#c40000";

    message.innerText =
      "Cika email da password.";

    return;
  }


  /*
    CHECK EMAIL BEFORE AUTH
  */

  if(
    email.toLowerCase()
    !==
    ADMIN_EMAIL.toLowerCase()
  ){

    message.style.color =
      "#c40000";

    message.innerText =
      "Ba ka da izinin shiga Admin.";

    return;
  }


  message.style.color =
    "#555";

  message.innerText =
    "Ana shiga...";


  const {
    data,
    error
  } =
  await supabaseClient
  .auth
  .signInWithPassword({

    email:email,

    password:password

  });


  if(error){

    message.style.color =
      "#c40000";

    message.innerText =
      error.message;

    return;
  }


  /*
    DOUBLE CHECK AFTER LOGIN
  */

  if(
    !data.user.email ||
    data.user.email.toLowerCase()
    !==
    ADMIN_EMAIL.toLowerCase()
  ){

    await supabaseClient
      .auth
      .signOut();

    message.style.color =
      "#c40000";

    message.innerText =
      "Ba ka da izinin shiga Admin.";

    return;
  }


  currentUser =
    data.user;


  showAdmin();

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

  document
    .getElementById("loginSection")
    .classList
    .remove("hide");


  document
    .getElementById("adminSection")
    .classList
    .add("hide");

}


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin(){

  document
    .getElementById("loginSection")
    .classList
    .add("hide");


  document
    .getElementById("adminSection")
    .classList
    .remove("hide");


  document
    .getElementById("adminEmailDisplay")
    .innerText =
      currentUser.email;


  loadPosts();

  loadLive();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await supabaseClient
    .auth
    .signOut();


  currentUser =
    null;


  showLogin();

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

function previewImage(event){

  const file =
    event.target.files[0];


  const preview =
    document
    .getElementById("imagePreview");


  if(!file){

    preview.style.display =
      "none";

    preview.src =
      "";

    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      preview.src =
        e.target.result;

      preview.style.display =
        "block";

    };


  reader.readAsDataURL(file);

}


/* =====================================================
   LOAD POSTS
===================================================== */

async function loadPosts(){

  const list =
    document
    .getElementById("postsList");


  list.innerHTML =
    "Loading...";


  const {
    data,
    error
  } =
  await supabaseClient
  .from("posts")
  .select(`
    id,
    Title,
    Content,
    Image_url,
    category,
    views,
    breaking_news,
    featured,
    created_at
  `)
  .order(
    "created_at",
    {
      ascending:false
    }
  );


  if(error){

    list.innerHTML =
      `<p style="color:#c40000">
        ${escapeHtml(error.message)}
      </p>`;

    return;
  }


  allPosts =
    data || [];


  updateStats();

  renderPosts(allPosts);

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

  const total =
    allPosts.length;


  const breaking =
    allPosts.filter(
      p => p.breaking_news === true
    ).length;


  const featured =
    allPosts.filter(
      p => p.featured === true
    ).length;


  const views =
    allPosts.reduce(
      (sum,p) =>
        sum +
        Number(p.views || 0),
      0
    );


  document
    .getElementById("totalNews")
    .innerText =
      total;


  document
    .getElementById("totalBreaking")
    .innerText =
      breaking;


  document
    .getElementById("totalFeatured")
    .innerText =
      featured;


  document
    .getElementById("totalViews")
    .innerText =
      views;
}


/* =====================================================
   RENDER POSTS
===================================================== */

function renderPosts(posts){

  const list =
    document
    .getElementById("postsList");


  if(!posts.length){

    list.innerHTML =
      "<p>Babu labarai.</p>";

    return;
  }


  list.innerHTML =
    posts.map(post => {

      const title =
        escapeHtml(
          post.Title || ""
        );


      const category =
        escapeHtml(
          post.category || "Labarai"
        );


      const views =
        Number(
          post.views || 0
        );


      const date =
        formatDate(
          post.created_at
        );


      return `

        <div class="news-item">

          <div class="news-title">
            ${title}
          </div>

          <div class="news-meta">
            Category: ${category}
            |
            Views: ${views}
            |
            ${date}
          </div>

          ${
            post.breaking_news
            ?
            `<span style="color:#c40000;font-weight:bold">
              🔴 BREAKING
            </span>`
            :
            ""
          }

          ${
            post.featured
            ?
            `<span style="color:#168a35;font-weight:bold;margin-left:8px">
              ⭐ FEATURED
            </span>`
            :
            ""
          }

          <div class="actions">

            <button
              class="btn-blue"
              onclick="editPost(${post.id})"
            >
              EDIT
            </button>

            <button
              class="btn-red"
              onclick="deletePost(${post.id})"
            >
              DELETE
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =====================================================
   FILTER POSTS
===================================================== */

function filterPosts(){

  const search =
    document
    .getElementById("searchNews")
    .value
    .toLowerCase()
    .trim();


  if(!search){

    renderPosts(allPosts);

    return;
  }


  const filtered =
    allPosts.filter(post => {

      const title =
        String(
          post.Title || ""
        ).toLowerCase();


      const content =
        String(
          post.Content || ""
        ).toLowerCase();


      return (
        title.includes(search)
        ||
        content.includes(search)
      );

    });


  renderPosts(filtered);

}


/* =====================================================
   SAVE POST
===================================================== */

async function savePost(){

  /*
    SECURITY CHECK
  */

  if(
    !currentUser ||
    !currentUser.email ||
    currentUser.email.toLowerCase()
    !==
    ADMIN_EMAIL.toLowerCase()
  ){

    alert(
      "Ba ka da izinin yin wannan aikin."
    );

    return;
  }


  const title =
    document
    .getElementById("postTitle")
    .value
    .trim();


  const content =
    document
    .getElementById("postContent")
    .value
    .trim();


  const category =
    document
    .getElementById("postCategory")
    .value;


  const breakingNews =
    document
    .getElementById("breakingNews")
    .checked;


  const featuredNews =
    document
    .getElementById("featuredNews")
    .checked;


  const editId =
    document
    .getElementById("editId")
    .value;


  const imageFile =
    document
    .getElementById("postImage")
    .files[0];


  const message =
    document
    .getElementById("postMessage");


  if(!title){

    message.style.color =
      "#c40000";

    message.innerText =
      "Rubuta title.";

    return;
  }


  if(!content){

    message.style.color =
      "#c40000";

    message.innerText =
      "Rubuta content.";

    return;
  }


  /*
    NEW POST MUST HAVE IMAGE
  */

  if(!editId && !imageFile){

    message.style.color =
      "#c40000";

    message.innerText =
      "Saka hoton labarin.";

    return;
  }


  message.style.color =
    "#555";

  message.innerText =
    "Ana ajiye labari...";


  let imageUrl =
    null;


  /*
    IF EDITING:
    GET OLD IMAGE
  */

  if(editId){

    const oldPost =
      allPosts.find(
        p =>
          String(p.id)
          ===
          String(editId)
      );


    if(oldPost){

      imageUrl =
        oldPost.Image_url || null;

    }

  }


  /*
    UPLOAD IMAGE
  */

  if(imageFile){

    if(
      imageFile.size
      >
      50 * 1024 * 1024
    ){

      message.style.color =
        "#c40000";

      message.innerText =
        "Hoton ya fi 50MB.";

      return;
    }


    const extension =
      imageFile.name
      .split(".")
      .pop();


    const fileName =
      `${Date.now()}-${Math.random()
        .toString(36)
        .substring(2)}.${extension}`;


    const filePath =
      fileName;


    const {
      error:
        uploadError
    } =
    await supabaseClient
    .storage
    .from("post-media")
    .upload(
      filePath,
      imageFile,
      {
        cacheControl:"3600",
        upsert:false
      }
    );


    if(uploadError){

      message.style.color =
        "#c40000";

      message.innerText =
        uploadError.message;

      return;
    }


    const {
      data:
        publicData
    } =
    supabaseClient
      .storage
      .from("post-media")
      .getPublicUrl(
        filePath
      );


    imageUrl =
      publicData.publicUrl;

  }


  /*
    UPDATE
  */

  if(editId){

    const {
      error
    } =
    await supabaseClient
    .from("posts")
    .update({

      Title:title,

      Content:content,

      Image_url:imageUrl,

      category:category,

      breaking_news:breakingNews,

      featured:featuredNews

    })
    .eq(
      "id",
      editId
    );


    if(error){

      message.style.color =
        "#c40000";

      message.innerText =
        error.message;

      return;
    }


    message.style.color =
      "#168a35";

    message.innerText =
      "An gyara labari successfully.";

  }

  /*
    INSERT
  */

  else{

    const {
      error
    } =
    await supabaseClient
    .from("posts")
    .insert({

      Title:title,

      Content:content,

      Image_url:imageUrl,

      category:category,

      views:0,

      breaking_news:breakingNews,

      featured:featuredNews

    });


    if(error){

      message.style.color =
        "#c40000";

      message.innerText =
        error.message;

      return;
    }


    message.style.color =
      "#168a35";

    message.innerText =
      "An wallafa labari successfully.";

  }


  resetForm();

  await loadPosts();

}


/* =====================================================
   EDIT POST
===================================================== */

function editPost(id){

  const post =
    allPosts.find(
      p =>
        String(p.id)
        ===
        String(id)
    );


  if(!post){

    alert(
      "Ba a sami labarin ba."
    );

    return;
  }


  document
    .getElementById("editId")
    .value =
      post.id;


  document
    .getElementById("postTitle")
    .value =
      post.Title || "";


  document
    .getElementById("postContent")
    .value =
      post.Content || "";


  document
    .getElementById("postCategory")
    .value =
      post.category || "Labarai";


  document
    .getElementById("breakingNews")
    .checked =
      post.breaking_news === true;


  document
    .getElementById("featuredNews")
    .checked =
      post.featured === true;


  document
    .getElementById("formTitle")
    .innerText =
      "Edit News";


  const preview =
    document
    .getElementById("imagePreview");


  if(post.Image_url){

    preview.src =
      post.Image_url;

    preview.style.display =
      "block";

  }else{

    preview.style.display =
      "none";

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   DELETE POST
===================================================== */

async function deletePost(id){

  /*
    SECURITY CHECK
  */

  if(
    !currentUser ||
    !currentUser.email ||
    currentUser.email.toLowerCase()
    !==
    ADMIN_EMAIL.toLowerCase()
  ){

    alert(
      "Ba ka da izinin yin wannan aikin."
    );

    return;
  }


  const confirmDelete =
    confirm(
      "Ka tabbata kana son goge wannan labarin?"
    );


  if(!confirmDelete){

    return;
  }


  const {
    error
  } =
  await supabaseClient
  .from("posts")
  .delete()
  .eq(
    "id",
    id
  );


  if(error){

    alert(
      error.message
    );

    return;
  }


  await loadPosts();

}


/* =====================================================
   RESET FORM
===================================================== */

function resetForm(){

  document
    .getElementById("editId")
    .value =
      "";


  document
    .getElementById("postTitle")
    .value =
      "";


  document
    .getElementById("postContent")
    .value =
      "";


  document
    .getElementById("postCategory")
    .value =
      "Labarai";


  document
    .getElementById("breakingNews")
    .checked =
      false;


  document
    .getElementById("featuredNews")
    .checked =
      false;


  document
    .getElementById("postImage")
    .value =
      "";


  document
    .getElementById("formTitle")
    .innerText =

/* =====================================================
   YOUTUBE LIVE
===================================================== */

async function loadLive(){

  const status =
    document
    .getElementById("liveStatus");


  const {
    data,
    error
  } =
  await supabaseClient
  .from("live_stream")
  .select("*")
  .limit(1);


  if(error){

    status.innerText =
      "Live table ba a samu ba.";

    return;
  }


  if(data && data.length){

    const live =
      data[0];


    document
      .getElementById("liveUrl")
      .value =
        live.url || "";


    status.innerText =
      live.is_live
      ?
      "🔴 LIVE yana aiki yanzu."
      :
      "⚫ Ba LIVE yanzu.";

  }else{

    status.innerText =
      "⚫ Ba LIVE yanzu.";

  }

}


/* =====================================================
   ACTIVATE LIVE
===================================================== */

async function activateLive(){

  if(
    !currentUser ||
    !currentUser.email ||
    currentUser.email.toLowerCase()
    !==
    ADMIN_EMAIL.toLowerCase()
  ){

    alert(
      "Ba ka da izinin yin wannan aikin."
    );

    return;
  }


  const url =
    document
    .getElementById("liveUrl")
    .value
    .trim();


  const message =
    document
    .getElementById("liveMessage");


  if(!url){

    message.style.color =
      "#c40000";

    message.innerText =
      "Saka YouTube Live URL.";

    return;
  }


  /*
    Check existing record
  */

  const {
    data
  } =
  await supabaseClient
  .from("live_stream")
  .select("id")
  .limit(1);


  let error;


  if(data && data.length){

    const result =
      await supabaseClient
      .from("live_stream")
      .update({

        url:url,

        is_live:true

      })
      .eq(
        "id",
        data[0].id
      );


    error =
      result.error;

  }else{

    const result =
      await supabaseClient
      .from("live_stream")
      .insert({

        url:url,

        is_live:true

      });


    error =
      result.error;

  }


  if(error){

    message.style.color =
      "#c40000";

    message.innerText =
      error.message;

    return;
  }


  message.style.color =
    "#168a35";

  message.innerText =
    "LIVE an kunna.";


  loadLive();

}


/* =====================================================
   END LIVE
===================================================== */

async function endLive(){

  if(
    !currentUser ||
    !currentUser.email ||
    currentUser.email.toLowerCase()
    !==
    ADMIN_EMAIL.toLowerCase()
  ){

    alert(
      "Ba ka da izinin yin wannan aikin."
    );

    return;
  }


  const {
    error
  } =
  await supabaseClient
  .from("live_stream")
  .update({

    is_live:false

  })
  .neq(
    "id",
    0
  );


  if(error){

    document
      .getElementById("liveMessage")
      .innerText =
        error.message;

    return;
  }


  document
    .getElementById("liveMessage")
    .style.color =
      "#168a35";


  document
    .getElementById("liveMessage")
    .innerText =
      "LIVE ya ƙare.";


  loadLive();

}


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatDate(date){

  if(!date){

    return "";
  }


  return new Date(date)
    .toLocaleDateString(
      "ha-NG",
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );

}
