<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMINCHI NEWS HAUSA | Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f5f7;
  color:#171717;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.box{
  background:#fff;
  border-radius:14px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.logo-title{
  text-align:center;
  color:#c40000;
  font-size:30px;
  font-weight:900;
}

.subtitle{
  text-align:center;
  color:#777;
  margin:8px 0 25px;
}

h2{
  color:#c40000;
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:700;
  margin:15px 0 7px;
}

input,
textarea,
select{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
  outline:none;
  background:#fff;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#c40000;
}

textarea{
  min-height:180px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  padding:13px 18px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  width:100%;
  background:#c40000;
  color:#fff;
  font-size:17px;
  margin-top:20px;
}

.login-btn{
  background:#111;
}

.logout{
  width:100%;
  background:#222;
  color:#fff;
}

.cancel{
  width:100%;
  background:#777;
  color:#fff;
  margin-top:10px;
  display:none;
}

.message{
  text-align:center;
  margin-top:15px;
  font-weight:700;
  line-height:1.5;
}

.success{
  color:#087f23;
}

.error{
  color:#c40000;
}

/* OPTIONS */

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

.option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:15px;
  border-radius:10px;
  border:1px solid #ddd;
}

.option input{
  width:22px;
  height:22px;
  margin:0;
}

.breaking{
  background:#fff2f2;
  border-color:#e3a2a2;
}

.breaking label{
  color:#c40000;
  margin:0;
}

.featured{
  background:#fffaf0;
  border-color:#e3c27b;
}

.featured label{
  color:#8a5a00;
  margin:0;
}

/* PREVIEW */

.preview{
  margin-top:15px;
  text-align:center;
}

.preview img,
.preview video{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:10px;
}

/* POSTS */

.post-card{
  border:1px solid #ddd;
  border-radius:12px;
  padding:16px;
  margin-top:18px;
}

.post-card img,
.post-card video{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:10px;
  margin:12px 0;
}

.post-title{
  font-size:21px;
  font-weight:800;
  margin:8px 0;
}

.post-content{
  color:#555;
  line-height:1.6;
  white-space:pre-wrap;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
}

.category{
  background:#111;
  color:#fff;
}

.breaking-badge{
  background:#c40000;
  color:#fff;
}

.featured-badge{
  background:#f0b000;
  color:#111;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.edit{
  flex:1;
  background:#111;
  color:#fff;
}

.delete{
  flex:1;
  background:#c40000;
  color:#fff;
}

/* LIVE */

.live-box{
  border:2px solid #ddd;
  border-radius:12px;
  padding:20px;
}

.live-title{
  text-align:center;
  font-size:25px;
  font-weight:900;
  color:#c40000;
  margin-bottom:8px;
}

.live-status{
  text-align:center;
  background:#f2f2f2;
  padding:13px;
  border-radius:8px;
  margin-top:15px;
  font-weight:700;
}

.end-live{
  width:100%;
  background:#222;
  color:#fff;
  margin-top:10px;
}

.back{
  display:block;
  text-align:center;
  color:#c40000;
  font-weight:700;
  text-decoration:none;
  margin:25px;
}

/* MOBILE */

@media(max-width:600px){

.container{
  padding:12px;
}

.box{
  padding:18px;
}

.logo-title{
  font-size:24px;
}

.options{
  grid-template-columns:1fr;
}

.actions{
  flex-direction:column;
}

}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div class="box" id="loginArea">

<div class="logo-title">
AMINCHI NEWS HAUSA
</div>

<p class="subtitle">
Admin Panel
</p>

<label>Email</label>

<input
type="email"
id="loginEmail"
placeholder="Enter admin email"
autocomplete="email"
>

<label>Password</label>

<input
type="password"
id="loginPassword"
placeholder="Enter admin password"
autocomplete="current-password"
>

<button
class="primary login-btn"
id="loginBtn"
>
🔐 Login
</button>

<div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN -->

<div id="adminArea" style="display:none">


<!-- CREATE POST -->

<div class="box">

<div class="logo-title">
AMINCHI NEWS HAUSA
</div>

<p
class="subtitle"
id="formTitle"
>
Sabon Labari
</p>


<label>
📰 Taken Labari
</label>

<input
type="text"
id="title"
placeholder="Rubuta taken labarin..."
>


<label>
🗂️ Rukuni / Category
</label>

<select id="category">

<option value="Labarai">📰 Labarai</option>

<option value="Kano">🏙️ Kano</option>

<option value="Najeriya">🇳🇬 Najeriya</option>

<option value="Siyasa">🏛️ Siyasa</option>

<option value="Duniya">🌍 Duniya</option>

<option value="Wasanni">⚽ Wasanni</option>

<option value="Kasuwanci">💼 Kasuwanci</option>

<option value="Kannywood">🎬 Kannywood</option>

<option value="Nishaɗi">🎤 Nishaɗi</option>

<option value="Hotuna">📸 Hotuna</option>

<option value="Bidiyo">🎥 Bidiyo</option>

</select>


<div class="options">

<div class="option breaking">

<input
type="checkbox"
id="breakingNews"
>

<label for="breakingNews">
🚨 BREAKING NEWS
</label>

</div>


<div class="option featured">

<input
type="checkbox"
id="featured"
>

<label for="featured">
⭐ MANYAN LABARAI
</label>

</div>

</div>


<label>
📝 Cikakken Labari
</label>

<textarea
id="content"
placeholder="Rubuta cikakken labarin a nan..."
></textarea>


<label>
📸 Hoto ko 🎥 Bidiyo
</label>

<p style="font-size:13px;color:#777;margin-bottom:8px">
Dole ne ka saka hoto ko bidiyo kafin ka wallafa.
</p>

<input
type="file"
id="media"
accept="image/*,video/*"
>

<div
id="preview"
class="preview"
></div>


<button
id="publishBtn"
class="primary"
>
🚀 Wallafa Labari
</button>


<button
id="cancelBtn"
class="cancel"
>
Cancel Edit
</button>


<div
id="message"
class="message"
></div>

</div>


<!-- YOUTUBE LIVE -->

<div class="box">

<div class="live-box">

<div class="live-title">
🔴 YouTube LIVE
</div>

<p class="subtitle">
Saka link ɗin YouTube Live ɗinka.
</p>

<label>
YouTube Live Link
</label>

<input
type="text"
id="liveUrl"
placeholder="https://www.youtube.com/watch?v=XXXXXXXXXXX"
>

<button
id="saveLiveBtn"
class="primary"
>
🔴 Activate Live
</button>

<button
id="removeLiveBtn"
class="end-live"
>
⏹️ End Live
</button>

<div
id="liveMessage"
class="message"
></div>

<div
id="liveStatus"
class="live-status"
>
Checking live status...
</div>

</div>

</div>


<!-- MANAGE POSTS -->

<div class="box">

<h2>
📰 Manage Labarai
</h2>

<div id="posts">

<div class="empty">
Loading posts...
</div>

</div>

</div>


<!-- LOGOUT -->

<div class="box">

<button
id="logoutBtn"
class="logout"
>
🚪 Logout
</button>

</div>

</div>


<a
class="back"
href="index.html"
>
← Komawa AMINCHI NEWS HAUSA
</a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* SUPABASE */

const SUPABASE_URL =
"https://kszficrcngxipcllezgl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hsMkfMvXMbAXXt8Z7LvAvg_52miDaJe";

const BUCKET =
"post-media";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ELEMENTS */

const loginArea =
document.getElementById("loginArea");

const adminArea =
document.getElementById("adminArea");

const loginEmail =
document.getElementById("loginEmail");

const loginPassword =
document.getElementById("loginPassword");

const loginBtn =
document.getElementById("loginBtn");

const loginMessage =
document.getElementById("loginMessage");

const logoutBtn =
document.getElementById("logoutBtn");

const titleInput =
document.getElementById("title");

const categoryInput =
document.getElementById("category");

const breakingInput =
document.getElementById("breakingNews");

const featuredInput =
document.getElementById("featured");

const contentInput =
document.getElementById("content");

const mediaInput =
document.getElementById("media");

const preview =
document.getElementById("preview");

const publishBtn =
document.getElementById("publishBtn");

const cancelBtn =
document.getElementById("cancelBtn");

const message =
document.getElementById("message");

const postsContainer =
document.getElementById("posts");

const formTitle =
document.getElementById("formTitle");

const liveUrl =
document.getElementById("liveUrl");

const saveLiveBtn =
document.getElementById("saveLiveBtn");

const removeLiveBtn =
document.getElementById("removeLiveBtn");

const liveMessage =
document.getElementById("liveMessage");

const liveStatus =
document.getElementById("liveStatus");


let editingId = null;
let oldMediaUrl = null;


/* MESSAGES */

function showLoginMessage(text,type){

loginMessage.textContent =
text;

loginMessage.className =
"message " + type;

}


function showMessage(text,type){

message.textContent =
text;

message.className =
"message " + type;

}


function showLiveMessage(text,type){

liveMessage.textContent =
text;

liveMessage.className =
"message " + type;

}


/* LOGIN */

loginBtn.addEventListener(
"click",
async function(){

const email =
loginEmail.value.trim();

const password =
loginPassword.value;

if(!email || !password){

showLoginMessage(
"❌ Saka email da password.",
"error"
);

return;

}

loginBtn.disabled =
true;

showLoginMessage(
"Logging in...",
"success"
);

try{

const result =
await client.auth.signInWithPassword({

email:email,

password:password

});

if(result.error){

throw result.error;

}

showAdmin();

}

catch(error){

showLoginMessage(
"❌ " + error.message,
"error"
);

}

loginBtn.disabled =
false;

});


/* SHOW ADMIN */

function showAdmin(){

loginArea.style.display =
"none";

adminArea.style.display =
"block";

loadPosts();

loadLive();

}


/* LOGOUT */

logoutBtn.addEventListener(
"click",
async function(){

await client.auth.signOut();

adminArea.style.display =
"none";

loginArea.style.display =
"block";

loginPassword.value =
"";

});


/* SESSION */

async function checkSession(){

const result =
await client.auth.getSession();

if(result.data.session){

showAdmin();

}

}

checkSession();


/* MEDIA PREVIEW */

mediaInput.addEventListener(
"change",
function(){

preview.innerHTML =
"";

const file =
mediaInput.files[0];

if(!file){

return;

}

if(
file.size >
50 * 1024 * 1024
){

showMessage(
"❌ File ya wuce 50 MB.",
"error"
);

mediaInput.value =
"";

return;

}

const url =
URL.createObjectURL(file);

if(
file.type.startsWith("image/")
){

const img =
document.createElement("img");

img.src =
url;

preview.appendChild(img);

}

else if(
file.type.startsWith("video/")
){

const video =
document.createElement("video");

video.src =
url;

video.controls =
true;

video.playsInline =
true;

preview.appendChild(video);

}

});


/* UPLOAD */

async function uploadMedia(file){

const safeName =
file.name.replace(
/[^a-zA-Z0-9.-]/g,
"-"
);

const fileName =
Date.now() +
"-" +
safeName;

const result =
await client.storage
.from(BUCKET)
.upload(
fileName,
file,
{
cacheControl:"3600",
upsert:false,
contentType:file.type
}
);

if(result.error){

throw new Error(
"Upload failed: " +
result.error.message
);

}

const publicResult =
client.storage
.from(BUCKET)
.getPublicUrl(fileName);

return publicResult.data.publicUrl;

}


/* PUBLISH / UPDATE */

publishBtn.addEventListener(
"click",
async function(){

const title =
titleInput.value.trim();

const category =
categoryInput.value;

const content =
contentInput.value.trim();

const breakingNews =
breakingInput.checked;

const featured =
featuredInput.checked;

const file =
mediaInput.files[0];


/* VALIDATION */

if(!title){

showMessage(
"❌ Rubuta taken labari.",
"error"
);

return;

}

if(!content){

showMessage(
"❌ Rubuta cikakken labari.",
"error"
);

return;

}


/* PHOTO REQUIRED */

if(!file && !oldMediaUrl){

showMessage(
"❌ Dole ne ka saka hoto ko bidiyo.",
"error"
);

return;

}

publishBtn.disabled =
true;


try{

let mediaUrl =
oldMediaUrl;


/* UPLOAD */

if(file){

showMessage(
"📤 Ana uploading media...",
"success"
);

mediaUrl =
await uploadMedia(file);

}


/* UPDATE */

if(editingId){

const result =
await client
.from("posts")
.update({

Title:title,

category:category,

Content:content,

Image_url:mediaUrl,

breaking_news:breakingNews,

featured:featured

})
.eq(
"id",
editingId
);

if(result.error){

throw result.error;

}

showMessage(
"✅ An sabunta labarin.",
"success"
);

}


/* INSERT */

else{

showMessage(
"📰 Ana wallafa labari...",
"success"
);

const result =
await client
.from("posts")
.insert([{

Title:title,

category:category,

Content:content,

Image_url:mediaUrl,

breaking_news:breakingNews,

featured:featured

}]);

if(result.error){

throw result.error;

}

showMessage(
"✅ An wallafa labarin successfully!",
"success"
);

}

resetForm();

loadPosts();

}

catch(error){

console.error(error);

showMessage(
"❌ " + error.message,
"error"
);

}

publishBtn.disabled =
false;

});


/* LOAD POSTS */

async function loadPosts(){

postsContainer.innerHTML =
'<div class="empty">Loading posts...</div>';

const result =
await client
.from("posts")
.select("*")
.order(
"id",
{
ascending:false
}
);

if(result.error){

postsContainer.innerHTML =
`<div class="empty">
❌ ${result.error.message}
</div>`;

return;

}

const posts =
result.data || [];

if(posts.length === 0){

postsContainer.innerHTML =
'<div class="empty">Babu labarai tukuna.</div>';

return;

}

postsContainer.innerHTML =
"";


posts.forEach(
function(post){

const card =
document.createElement("div");

card.className =
"post-card";


/* BADGES */

const badges =
document.createElement("div");

badges.className =
"badges";


const categoryBadge =
document.createElement("span");

categoryBadge.className =
"badge category";

categoryBadge.textContent =
post.category ||
"Labarai";

badges.appendChild(
categoryBadge
);


if(post.breaking_news === true){

const badge =
document.createElement("span");

badge.className =
"badge breaking-badge";

badge.textContent =
"🚨 BREAKING";

badges.appendChild(badge);

}


if(post.featured === true){

const badge =
document.createElement("span");

badge.className =
"badge featured-badge";

badge.textContent =
"⭐ MANYAN LABARAI";

badges.appendChild(badge);

}


card.appendChild(badges);


/* MEDIA */

if(post.Image_url){

const url =
post.Image_url;

const lower =
url.toLowerCase();

if(
lower.includes(".mp4") ||
lower.includes(".webm") ||
lower.includes(".mov") ||
lower.includes(".m4v")
){

const video =
document.createElement("video");

video.src =
url;

video.controls =
true;

video.playsInline =
true;

card.appendChild(video);

}

else{

const img =
document.createElement("img");

img.src =
url;

img.alt =
post.Title || "News";

card.appendChild(img);

}

}


/* TITLE */

const title =
document.createElement("div");

title.className =
"post-title";

title.textContent =
post.Title ||
"Untitled";

card.appendChild(title);


/* CONTENT */

const content =
document.createElement("p");

content.className =
"post-content";

content.textContent =
post.Content ||
"";

card.appendChild(content);


/* ACTIONS */

const actions =
document.createElement("div");

actions.className =
"actions";


const editBtn =
document.createElement("button");

editBtn.className =
"edit";

editBtn.textContent =
"✏️ Edit";

editBtn.onclick =
function(){

startEdit(post);

};


const deleteBtn =
document.createElement("button");

deleteBtn.className =
"delete";

deleteBtn.textContent =
"🗑️ Delete";

deleteBtn.onclick =
function(){

deletePost(post);

};


actions.appendChild(editBtn);

actions.appendChild(deleteBtn);

card.appendChild(actions);

postsContainer.appendChild(card);

});

}


/* EDIT */

function startEdit(post){

editingId =
post.id;

oldMediaUrl =
post.Image_url || null;

titleInput.value =
post.Title || "";

categoryInput.value =
post.category || "Labarai";

contentInput.value =
post.Content || "";

breakingInput.checked =
post.breaking_news === true;

featuredInput.checked =
post.featured === true;

mediaInput.value =
"";

preview.innerHTML =
"";

if(post.Image_url){

const img =
document.createElement("img");

img.src =
post.Image_url;

preview.appendChild(img);

}

formTitle.textContent =
"✏️ Gyara Labari";

publishBtn.textContent =
"💾 Update Labari";

cancelBtn.style.display =
"block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* RESET */

cancelBtn.addEventListener(
"click",
resetForm
);


function resetForm(){

editingId =
null;

oldMediaUrl =
null;

titleInput.value =
"";

categoryInput.value =
"Labarai";

contentInput.value =
"";

breakingInput.checked =
false;

featuredInput.checked =
false;

mediaInput.value =
"";

preview.innerHTML =
"";

formTitle.textContent =
"Sabon Labari";

publishBtn.textContent =
"🚀 Wallafa Labari";

cancelBtn.style.display =
"none";

}


/* DELETE */

async function deletePost(post){

const yes =
confirm(
"Ka tabbata kana son goge wannan labarin?"
);

if(!yes){

return;

}

try{

const result =
await client
.from("posts")
.delete()
.eq(
"id",
post.id
);

if(result.error){

throw result.error;

}

showMessage(
"✅ An goge labarin.",
"success"
);

loadPosts();

}

catch(error){

showMessage(
"❌ Delete failed: " +
error.message,
"error"
);

}

}


/* YOUTUBE ID */

function getYouTubeId(url){

try{

const parsed =
new URL(url);

if(
parsed.hostname.includes("youtube.com")
){

return parsed.searchParams.get("v");

}

if(
parsed.hostname === "youtu.be"
){

return parsed.pathname.substring(1);

}

return null;

}

catch(error){

return null;

}

}


/* ACTIVATE LIVE */

saveLiveBtn.addEventListener(
"click",
async function(){

const url =
liveUrl.value.trim();

if(!url){

showLiveMessage(
"❌ Saka YouTube Live link.",
"error"
);

return;

}

const videoId =
getYouTubeId(url);

if(!videoId){

showLiveMessage(
"❌ YouTube link ba daidai ba ne.",
"error"
);

return;

}

saveLiveBtn.disabled =
true;

try{

const result =
await client
.from("live_stream")
.upsert({

id:1,

youtube_id:videoId,

active:true

});

if(result.error){

throw result.error;

}

showLiveMessage(
"✅ LIVE ya kunna.",
"success"
);

liveStatus.textContent =
"🔴 LIVE IS ACTIVE";

}

catch(error){

showLiveMessage(
"❌ " + error.message,
"error"
);

}

saveLiveBtn.disabled =
false;

});


/* END LIVE */

removeLiveBtn.addEventListener(
"click",
async function(){

try{

const result =
await client
.from("live_stream")
.update({
active:false
})
.eq(
"id",
1
);

if(result.error){

throw result.error;

}

showLiveMessage(
"⏹️ An kashe LIVE.",
"success"
);

liveStatus.textContent =
"Live is currently OFF";

}

catch(error){

showLiveMessage(
"❌ " + error.message,
"error"
);

}

});


/* LOAD LIVE */

async function loadLive(){

try{

const result =
await client
.from("live_stream")
.select(
"id,youtube_id,active"
)
.eq(
"id",
1
)
.maybeSingle();

if(result.error){

liveStatus.textContent =
"❌ " + result.error.message;

return;

}

if(
result.data &&
result.data.active === true &&
result.data.youtube_id
){

liveUrl.value =
"https://www.youtube.com/watch?v=" +
result.data.youtube_id;

liveStatus.textContent =
"🔴 LIVE IS ACTIVE";

}

else{

liveStatus.textContent =
"Live is currently OFF";

}

}

catch(error){

liveStatus.textContent =
"❌ " + error.message;

}

}

</script>

</body>
